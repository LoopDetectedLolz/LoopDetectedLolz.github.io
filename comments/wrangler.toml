name = "nfn-comments"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false            # no second public hostname; the API answers on our domain only

# wrangler creates this custom domain and its certificate on deploy, since the zone is in the same account
routes = [{ pattern = "api.networkfieldnotes.com", custom_domain = true }]

[vars]
ALLOWED_ORIGIN = "https://networkfieldnotes.com"

[[d1_databases]]
binding = "DB"
database_name = "nfn-comments"
database_id = "ff650a8a-c9b7-4201-8a3b-fd2d6c1fbbf9"

# Secrets, set with `wrangler secret put <NAME>`, never written in this file:
#   TURNSTILE_SECRET   the secret half of the Turnstile widget
#   ADMIN_TOKEN        a long random string; comments.py reads it from NFN_ADMIN_TOKEN
#   IP_SALT            any long random string; makes the stored IP hashes unguessable
