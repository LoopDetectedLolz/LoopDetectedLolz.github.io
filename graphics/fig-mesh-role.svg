<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="How an AOS 10 access point picks its mesh role at boot: Ethernet link down makes it a point, Ethernet up plus a reachable network makes it a portal, Ethernet up without reachability makes it a point">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .mono{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .hd{font-size:15px;font-weight:700}
    .q{font-size:12.5px;font-weight:600}
    .lb{font-size:12.5px;font-weight:600}
    .note{font-size:11.5px}
    .n{font-size:10.5px;letter-spacing:1.5px}
  </style>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8BA2AE"/></marker>
  </defs>
  <text x="15" y="26" class="t hd" fill="#ffffff">Nobody assigns the role. The AP decides at boot, on mesh-auto.</text>

  <rect x="15" y="46" width="180" height="46" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="105" y="68" class="t q" fill="#EAF2F6" text-anchor="middle">Eth 0 link up</text>
  <text x="105" y="84" class="t note" fill="#8BA2AE" text-anchor="middle">at boot?</text>

  <rect x="255" y="46" width="220" height="46" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="365" y="68" class="t q" fill="#EAF2F6" text-anchor="middle">Network reachable?</text>
  <text x="365" y="84" class="t note" fill="#8BA2AE" text-anchor="middle">gateway pings, or DHCP answers</text>

  <rect x="540" y="40" width="150" height="34" rx="8" fill="#8CE05E"/>
  <text x="615" y="62" class="t lb" fill="#06202A" text-anchor="middle">Mesh portal</text>
  <rect x="540" y="86" width="150" height="34" rx="8" fill="#5ED2DA"/>
  <text x="615" y="108" class="t lb" fill="#06202A" text-anchor="middle">Mesh point</text>

  <g stroke="#8BA2AE" stroke-width="1.4" fill="none" marker-end="url(#r)">
    <path d="M195 69 L249 69"/>
    <path d="M475 62 L534 57"/>
    <path d="M475 78 L534 100"/>
    <path d="M105 92 C105 140 300 140 534 106"/>
  </g>
  <text x="205" y="62" class="t mono n" fill="#8CE05E">YES</text>
  <text x="484" y="48" class="t mono n" fill="#8CE05E">YES</text>
  <text x="484" y="96" class="t mono n" fill="#F5A524">NO</text>
  <text x="120" y="112" class="t mono n" fill="#F5A524">NO ETHERNET</text>

  <text x="15" y="176" class="t mono n" fill="#8BA2AE">THE PART THAT SURPRISES PEOPLE</text>
  <text x="15" y="198" class="t note" fill="#B0C4CF" font-size="12">A point that later sees its Ethernet 0 link come up sends loop detection packets, and if the link is real it reboots</text>
  <text x="15" y="218" class="t note" fill="#B0C4CF" font-size="12">as a portal. So plugging a mesh point in to "check something" changes its role and costs you a reboot, and unplugging</text>
  <text x="15" y="238" class="t note" fill="#B0C4CF" font-size="12">a portal for five minutes reboots it too.</text>
</svg>
