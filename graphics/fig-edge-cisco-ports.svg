<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Catalyst 9300 and ClearPass: the switch sends RADIUS on 1812, accounting on 1813 and TACACS+ on TCP 49; ClearPass sends CoA to the switch on UDP 3799. The trap: aaa authorization commands 15 default group CPPM-TACACS local if-authenticated Config lines go to ClearPass too. A deny is final; local is only tried when no server answers. Own change, own revert timer.">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .m{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .hd{fill:#fff;font-size:15px;font-weight:700}
    .big{fill:#fff;font-size:20px;font-weight:700}
    .eb{fill:#8CE05E;font-size:11px;letter-spacing:2px;font-weight:600}
    .cap{fill:#8BA2AE;font-size:11px}
  </style>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8CE05E"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ED2DA"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4FBDEA"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8BA2AE"/></marker>
  </defs>
  <text x="20" y="28" class="t hd" font-size="12" fill="#fff">Who starts each conversation.</text>
  <rect x="20" y="60" width="150" height="236" rx="10" fill="rgba(3,10,16,0.55)" stroke="#4FBDEA" stroke-width="1.3"/>
  <text x="95" y="172" class="t" font-size="13" fill="#EAF2F6" text-anchor="middle" font-weight="700">Catalyst 9300</text>
  <text x="95" y="192" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">switch</text>
  <rect x="430" y="60" width="150" height="236" rx="10" fill="rgba(3,10,16,0.55)" stroke="#5ED2DA" stroke-width="1.3"/>
  <text x="505" y="164" class="t" font-size="14" fill="#EAF2F6" text-anchor="middle" font-weight="700">ClearPass</text>
  <text x="505" y="184" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">four nodes</text>
  <path d="M172 92 L426 92" stroke="#5ED2DA" stroke-width="2" fill="none" marker-end="url(#at)"/>
  <text x="186" y="84" class="m" font-size="12" fill="#5ED2DA" font-weight="700">UDP 1812</text>
  <text x="414" y="84" class="t" font-size="12" fill="#B0C4CF" text-anchor="end">RADIUS auth</text>
  <path d="M172 142 L426 142" stroke="#5ED2DA" stroke-width="2" fill="none" marker-end="url(#at)"/>
  <text x="186" y="134" class="m" font-size="12" fill="#5ED2DA" font-weight="700">UDP 1813</text>
  <text x="414" y="134" class="t" font-size="12" fill="#B0C4CF" text-anchor="end">accounting</text>
  <path d="M172 192 L426 192" stroke="#5ED2DA" stroke-width="2" fill="none" marker-end="url(#at)"/>
  <text x="186" y="184" class="m" font-size="12" fill="#5ED2DA" font-weight="700">TCP 49</text>
  <text x="414" y="184" class="t" font-size="12" fill="#B0C4CF" text-anchor="end">TACACS+</text>
  <path d="M428 254 L174 254" stroke="#8CE05E" stroke-width="2.2" fill="none" marker-end="url(#ag)"/>
  <text x="186" y="246" class="m" font-size="12" fill="#8CE05E" font-weight="700">UDP 3799</text>
  <text x="414" y="246" class="t" font-size="12" fill="#B0C4CF" text-anchor="end">CoA, ClearPass starts it</text>
  <text x="300" y="274" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">port 3799 under dynamic-author</text>
  <text x="300" y="228" class="t" font-size="11" fill="#8BA2AE"></text>
  <path d="M174 222 L300 222" stroke="#8BA2AE" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="186" y="216" class="t" font-size="11" fill="#8BA2AE">default listener on 1700: 3799 never lands</text>
  <rect x="606" y="60" width="274" height="236" rx="10" fill="rgba(3,10,16,0.55)" stroke="#F5A524" stroke-width="1.5"/>
  <text x="624" y="86" class="m" font-size="11" fill="#F5A524" font-weight="700">THE TRAP</text>
  <text x="624" y="112" class="m" font-size="11.5" fill="#F5A524">aaa authorization commands 15</text>
  <text x="624" y="131" class="m" font-size="11.5" fill="#F5A524">default group CPPM-TACACS</text>
  <text x="624" y="150" class="m" font-size="11.5" fill="#F5A524">local if-authenticated</text>
  <text x="624" y="179" class="t" font-size="12" fill="#B0C4CF">Config lines go to ClearPass too.</text>
  <text x="624" y="198" class="t" font-size="12" fill="#B0C4CF">A deny is final; local is only</text>
  <text x="624" y="217" class="t" font-size="12" fill="#B0C4CF">tried when no server answers.</text>
  <text x="624" y="246" class="t" font-size="12" fill="#B0C4CF">Own change, own revert timer.</text>
  <text x="20" y="318" class="t" font-size="11" fill="#8BA2AE">1812, 1813 and 49 start at the switch. Only CoA starts at ClearPass, so only CoA needs the switch to be listening.</text>
</svg>
