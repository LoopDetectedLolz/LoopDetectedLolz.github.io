<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="EX4100 / EX4400 edge port timeline: Laptop, supplicant, a few seconds; All four nodes down, .  Critical path: printer: EAPOL times out, then MAC RADIUS, PAP, then authorized by ClearPass. Reject path: unknown MAC, then ClearPass: Accept, then VLAN QUARANTINE.">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .m{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .hd{fill:#fff;font-size:15px;font-weight:700}
    .big{fill:#fff;font-size:20px;font-weight:700}
    .eb{fill:#8CE05E;font-size:11px;letter-spacing:2px;font-weight:600}
    .cap{fill:#8BA2AE;font-size:11px}
  </style>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8CE05E"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ED2DA"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4FBDEA"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8BA2AE"/></marker>
  </defs>
  <text x="20" y="28" class="t hd" font-size="12" fill="#fff">One port, four outcomes, link up to authorized.</text>
  <text x="20" y="56" class="m" font-size="11" fill="#8BA2AE">TO SCALE, SECONDS FROM LINK UP</text>
  <path d="M190 64 L190 196" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="190" y="210" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">0 s</text>
  <path d="M362.5 64 L362.5 196" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="362.5" y="210" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">30 s</text>
  <path d="M535 64 L535 196" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="535" y="210" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">60 s</text>
  <path d="M707.5 64 L707.5 196" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="707.5" y="210" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">90 s</text>
  <path d="M880 64 L880 196" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="880" y="210" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">120 s</text>
  <text x="20" y="91" class="t" font-size="12" fill="#EAF2F6" font-weight="600">Laptop, supplicant</text>
  <rect x="190" y="72" width="17.25" height="26" rx="5" fill="#5ED2DA" fill-opacity="0.25" stroke="#5ED2DA" stroke-width="1"/>
  <rect x="207.25" y="72" width="672.75" height="26" rx="5" fill="#8CE05E" stroke="#8CE05E" stroke-width="1"/>
  <text x="217.25" y="89.5" class="t" font-size="12" fill="#06202A" font-weight="700">authorized</text>
  <text x="870" y="89.5" class="t" font-size="11" fill="#06202A" text-anchor="end">a few seconds</text>
  <text x="20" y="153" class="t" font-size="12" fill="#EAF2F6" font-weight="600">All four nodes down</text>
  <rect x="190" y="134" width="138" height="26" rx="5" fill="#8BA2AE" fill-opacity="0.25" stroke="#8BA2AE" stroke-width="1"/>
  <text x="198" y="151.5" class="t" font-size="11" fill="#B0C4CF">RADIUS, 4 x 2 x 3 s</text>
  <rect x="328" y="134" width="379.5" height="26" rx="5" fill="#8BA2AE" fill-opacity="0.25" stroke="#8BA2AE" stroke-width="1"/>
  <text x="336" y="151.5" class="t" font-size="11" fill="#B0C4CF">802.1X timers on top</text>
  <rect x="707.5" y="134" width="172.5" height="26" rx="5" fill="#8CE05E" stroke="#8CE05E" stroke-width="1"/>
  <text x="717.5" y="151.5" class="t" font-size="12" fill="#06202A" font-weight="700">server-fail</text>
  <text x="870" y="151.5" class="t" font-size="11" fill="#06202A" text-anchor="end"></text>
  <text x="20" y="244" class="m" font-size="11" fill="#8BA2AE">SEQUENCE</text>
  <text x="20" y="274" class="t" font-size="12" fill="#EAF2F6" font-weight="600">Silent printer</text>
  <rect x="190" y="252" width="210" height="34" rx="8" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1.3"/>
  <text x="295" y="274" class="t" font-size="12" fill="#B0C4CF" text-anchor="middle">printer: EAPOL times out</text>
  <path d="M402 269 L425 269" stroke="#5ED2DA" stroke-width="1.6" fill="none" marker-end="url(#at)"/>
  <rect x="428" y="252" width="210" height="34" rx="8" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1.3"/>
  <text x="533" y="274" class="t" font-size="12" fill="#B0C4CF" text-anchor="middle">MAC RADIUS, PAP</text>
  <path d="M640 269 L663 269" stroke="#5ED2DA" stroke-width="1.6" fill="none" marker-end="url(#at)"/>
  <rect x="666" y="252" width="210" height="34" rx="8" fill="#8CE05E" stroke="#8CE05E" stroke-width="1.3"/>
  <text x="771" y="274" class="t" font-size="12" fill="#06202A" text-anchor="middle" font-weight="700">authorized by ClearPass</text>
  <text x="880" y="304" class="t" font-size="11" fill="#8BA2AE" text-anchor="end">transmit-period 10: time it on your release</text>
  <text x="20" y="334" class="t" font-size="12" fill="#EAF2F6" font-weight="600">Rejected</text>
  <rect x="190" y="312" width="210" height="34" rx="8" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1.3"/>
  <text x="295" y="334" class="t" font-size="12" fill="#B0C4CF" text-anchor="middle">unknown MAC</text>
  <path d="M402 329 L425 329" stroke="#5ED2DA" stroke-width="1.6" fill="none" marker-end="url(#at)"/>
  <rect x="428" y="312" width="210" height="34" rx="8" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1.3"/>
  <text x="533" y="334" class="t" font-size="12" fill="#B0C4CF" text-anchor="middle">ClearPass: Accept</text>
  <path d="M640 329 L663 329" stroke="#5ED2DA" stroke-width="1.6" fill="none" marker-end="url(#at)"/>
  <rect x="666" y="312" width="210" height="34" rx="8" fill="rgba(3,10,16,0.55)" stroke="#8BA2AE" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="771" y="334" class="t" font-size="12" fill="#EAF2F6" text-anchor="middle" font-weight="700">VLAN QUARANTINE</text>
  <text x="880" y="364" class="t" font-size="11" fill="#8BA2AE" text-anchor="end">an 802.1X reject uses server-reject-vlan</text>
  <text x="20" y="382" class="t" font-size="11" fill="#8BA2AE">server-fail at about 90 s: EX4300, Junos 21.4R1.12, 2026-09-25. RADIUS timers per Juniper&#x27;s guide.</text>
</svg>
