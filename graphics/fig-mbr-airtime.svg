<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Bars comparing beacon airtime: one beacon is 396 microseconds at 6 megabits and 116 at 24; six SSIDs on one radio cost 2.4 percent of the radio at 6 and 0.7 percent at 24">
<defs><style>text{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}.m{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}</style></defs>
<text x="30" y="30" fill="#8CE05E" font-size="11" font-weight="700" letter-spacing="2">ONE BEACON, 278 BYTES ON THE AIR</text>
<text x="30" y="66" fill="#B0C4CF" font-size="12">at 6 Mb/s</text>
<rect x="130" y="50" width="720" height="24" rx="6" fill="#5ED2DA"/>
<text x="840" y="67" fill="#06202A" font-size="12" font-weight="700" text-anchor="end" class="m">396 us</text>
<text x="30" y="106" fill="#B0C4CF" font-size="12">at 24 Mb/s</text>
<rect x="130" y="90" width="211" height="24" rx="6" fill="#8CE05E"/>
<text x="331" y="107" fill="#06202A" font-size="12" font-weight="700" text-anchor="end" class="m">116 us</text>
<text x="350" y="107" fill="#8BA2AE" font-size="11">20 us preamble plus 24 OFDM symbols, rounded up the way the radio does</text>
<text x="30" y="160" fill="#8CE05E" font-size="11" font-weight="700" letter-spacing="2">SIX SSIDS ON ONE RADIO, TEN BEACONS A SECOND EACH</text>
<text x="30" y="196" fill="#B0C4CF" font-size="12">at 6 Mb/s</text>
<rect x="130" y="180" width="720" height="24" rx="6" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)"/>
<rect x="130" y="180" width="173" height="24" rx="6" fill="#5ED2DA"/>
<text x="312" y="197" fill="#EAF2F6" font-size="12" font-weight="700" class="m">2.4% of the radio before any client speaks</text>
<text x="30" y="236" fill="#B0C4CF" font-size="12">at 24 Mb/s</text>
<rect x="130" y="220" width="720" height="24" rx="6" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)"/>
<rect x="130" y="220" width="50" height="24" rx="6" fill="#8CE05E"/>
<text x="190" y="237" fill="#EAF2F6" font-size="12" font-weight="700" class="m">0.7%</text>
<text x="30" y="270" fill="#B0C4CF" font-size="12">2.4 GHz</text><text x="30" y="284" fill="#B0C4CF" font-size="12">at 1 Mb/s</text>
<rect x="130" y="260" width="720" height="24" rx="6" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)"/>
<rect x="130" y="260" width="720" height="24" rx="6" fill="rgba(245,165,36,0.25)" stroke="#F5A524"/>
<rect x="130" y="260" width="104" height="24" rx="6" fill="#F5A524"/>
<text x="244" y="277" fill="#EAF2F6" font-size="12" font-weight="700" class="m">14.5%, the default nobody changes</text>
<text x="30" y="316" fill="#8BA2AE" font-size="11">The full bar is one radio's airtime. Each beacon is 102.4 ms apart, so ten a second is a rounding.</text>
</svg>
