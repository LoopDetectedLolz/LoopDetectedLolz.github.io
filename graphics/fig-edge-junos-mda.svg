<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="EX4100 / EX4400 phone and PC on one port. The phone is in the voice domain, tagged in the voice VLAN, because ClearPass returns Juniper-VoIP-Vlan. The PC is in the data domain with the VLAN from its own authorization.">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .m{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .hd{fill:#fff;font-size:15px;font-weight:700}
    .big{fill:#fff;font-size:20px;font-weight:700}
    .eb{fill:#8CE05E;font-size:11px;letter-spacing:2px;font-weight:600}
    .cap{fill:#8BA2AE;font-size:11px}
  </style>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8CE05E"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ED2DA"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4FBDEA"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8BA2AE"/></marker>
  </defs>
  <text x="20" y="28" class="t hd" font-size="12" fill="#fff">Two sessions on one port. Each gets its VLAN from its own authorization.</text>
  <rect x="20" y="150" width="120" height="60" rx="10" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="80" y="178" class="t" font-size="14" fill="#EAF2F6" text-anchor="middle" font-weight="700">PC</text>
  <text x="80" y="197" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">data device</text>
  <path d="M142 180 L182 180" stroke="#B0C4CF" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
  <rect x="186" y="150" width="130" height="60" rx="10" fill="rgba(3,10,16,0.55)" stroke="#5ED2DA" stroke-width="1.3"/>
  <text x="251" y="178" class="t" font-size="14" fill="#EAF2F6" text-anchor="middle" font-weight="700">IP phone</text>
  <text x="251" y="197" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">voice device</text>
  <path d="M318 180 L360 180" stroke="#B0C4CF" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
  <rect x="364" y="120" width="150" height="120" rx="10" fill="rgba(3,10,16,0.55)" stroke="#4FBDEA" stroke-width="1.5"/>
  <text x="439" y="150" class="m" font-size="11" fill="#8BA2AE" text-anchor="middle">EDGE PORT</text>
  <text x="439" y="176" class="t" font-size="13" fill="#EAF2F6" text-anchor="middle" font-weight="700">EX4100 / EX4400</text>
  <text x="439" y="200" class="m" font-size="11" fill="#4FBDEA" text-anchor="middle">multi-domain</text>
  <path d="M380 116 C 340 80, 290 90, 262 146" stroke="#8CE05E" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
  <text x="200" y="82" class="t" font-size="12" fill="#8CE05E">LLDP-MED: voip VLAN</text>
  <rect x="548" y="60" width="332" height="110" rx="10" fill="rgba(3,10,16,0.55)" stroke="#8CE05E" stroke-width="1.4"/>
  <text x="566" y="86" class="m" font-size="11" fill="#8CE05E">VOICE DOMAIN</text>
  <text x="566" y="110" class="t" font-size="14" fill="#EAF2F6" font-weight="700">VOICE VLAN, tagged</text>
  <text x="566" y="134" class="t" font-size="12" fill="#B0C4CF">ClearPass returns</text>
  <text x="566" y="154" class="m" font-size="12" fill="#5ED2DA">Juniper-VoIP-Vlan</text>
  <rect x="548" y="184" width="332" height="110" rx="10" fill="rgba(3,10,16,0.55)" stroke="#4FBDEA" stroke-width="1.4"/>
  <text x="566" y="210" class="m" font-size="11" fill="#4FBDEA">DATA DOMAIN</text>
  <text x="566" y="234" class="t" font-size="14" fill="#EAF2F6" font-weight="700">DATA VLAN, untagged</text>
  <text x="566" y="258" class="t" font-size="12" fill="#B0C4CF">ClearPass returns a VLAN,</text>
  <text x="566" y="278" class="t" font-size="12" fill="#B0C4CF">or the access VLAN stays</text>
  <path d="M516 160 L544 120" stroke="#8CE05E" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
  <path d="M516 200 L544 238" stroke="#4FBDEA" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <text x="20" y="318" class="t" font-size="11" fill="#B0C4CF">switch-options voip for the VLAN, protocols lldp-med to advertise it. multi-domain arrived in 18.3R1.</text>
</svg>
