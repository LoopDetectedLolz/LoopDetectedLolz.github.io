<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="On a Juniper EX a real client&#x27;s request walks four unreachable ClearPass nodes in order, two tries of three seconds each, before server-fail applies. There is no health probe.">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .m{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .hd{fill:#fff;font-size:15px;font-weight:700}
    .big{fill:#fff;font-size:20px;font-weight:700}
    .eb{fill:#8CE05E;font-size:11px;letter-spacing:2px;font-weight:600}
    .cap{fill:#8BA2AE;font-size:11px}
  </style>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8CE05E"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ED2DA"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4FBDEA"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8BA2AE"/></marker>
  </defs>
  <text x="30" y="36" class="t eb" font-size="12" fill="#8CE05E">802.1X ON JUNIPER EX</text>
  <text x="30" y="66" class="t big" font-size="12" fill="#fff">No probe. The first client finds the dead server.</text>
  <rect x="30" y="140" width="120" height="80" rx="10" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="90" y="176" class="t" font-size="14" fill="#EAF2F6" text-anchor="middle" font-weight="700">laptop</text>
  <text x="90" y="198" class="t" font-size="12" fill="#8BA2AE" text-anchor="middle">link up</text>
  <path d="M152 180 L166 180" stroke="#8BA2AE" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
  <rect x="170" y="150" width="128" height="60" rx="8" fill="none" stroke="#8BA2AE" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="234" y="176" class="t" font-size="13" fill="#B0C4CF" text-anchor="middle" font-weight="700">CPPM 1</text>
  <text x="234" y="196" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">2 x 3 s, silence</text>
  <path d="M300 180 L314 180" stroke="#8BA2AE" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
  <rect x="318" y="150" width="128" height="60" rx="8" fill="none" stroke="#8BA2AE" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="382" y="176" class="t" font-size="13" fill="#B0C4CF" text-anchor="middle" font-weight="700">CPPM 2</text>
  <text x="382" y="196" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">2 x 3 s, silence</text>
  <path d="M448 180 L462 180" stroke="#8BA2AE" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
  <rect x="466" y="150" width="128" height="60" rx="8" fill="none" stroke="#8BA2AE" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="530" y="176" class="t" font-size="13" fill="#B0C4CF" text-anchor="middle" font-weight="700">CPPM 3</text>
  <text x="530" y="196" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">2 x 3 s, silence</text>
  <path d="M596 180 L610 180" stroke="#8BA2AE" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
  <rect x="614" y="150" width="128" height="60" rx="8" fill="none" stroke="#8BA2AE" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="678" y="176" class="t" font-size="13" fill="#B0C4CF" text-anchor="middle" font-weight="700">CPPM 4</text>
  <text x="678" y="196" class="t" font-size="11" fill="#8BA2AE" text-anchor="middle">2 x 3 s, silence</text>
  <path d="M744 180 L760 180" stroke="#8CE05E" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <rect x="764" y="154" width="104" height="52" rx="10" fill="#8CE05E" stroke="#8CE05E" stroke-width="1"/>
  <text x="816" y="177" class="t" font-size="13" fill="#06202A" text-anchor="middle" font-weight="700">server-fail</text>
  <text x="816" y="195" class="t" font-size="11" fill="#06202A" text-anchor="middle">fallback</text>
  <path d="M170 236 L760 236" stroke="#5ED2DA" stroke-width="1.2"/>
  <path d="M170 230 L170 242 M760 230 L760 242" stroke="#5ED2DA" stroke-width="1.2"/>
  <text x="465" y="258" class="t" font-size="12" fill="#5ED2DA" text-anchor="middle">24 seconds of RADIUS before the switch gives up, and somebody is waiting</text>
  <text x="30" y="320" class="t cap" font-size="12" fill="#8BA2AE">retry 2, timeout 3, four nodes in order. A dead node comes back when revert-interval expires, unchecked.</text>
</svg>
