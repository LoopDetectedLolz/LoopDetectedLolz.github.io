<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="ClearPass sends change of authorization to UDP 3799. A Catalyst listens on UDP 1700 by default, so the request is never heard until port 3799 is set under aaa server radius dynamic-author.">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .m{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .hd{fill:#fff;font-size:15px;font-weight:700}
    .big{fill:#fff;font-size:20px;font-weight:700}
    .eb{fill:#8CE05E;font-size:11px;letter-spacing:2px;font-weight:600}
    .cap{fill:#8BA2AE;font-size:11px}
  </style>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8CE05E"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ED2DA"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4FBDEA"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8BA2AE"/></marker>
  </defs>
  <text x="30" y="36" class="t eb" font-size="12" fill="#8CE05E">IBNS 2.0 ON A CATALYST 9300</text>
  <text x="30" y="66" class="t big" font-size="12" fill="#fff">ClearPass sends CoA to 3799. The switch listens on 1700.</text>
  <rect x="30" y="110" width="200" height="170" rx="10" fill="rgba(3,10,16,0.55)" stroke="#5ED2DA" stroke-width="1.3"/>
  <text x="130" y="190" class="t" font-size="16" fill="#EAF2F6" text-anchor="middle" font-weight="700">ClearPass</text>
  <text x="130" y="212" class="t" font-size="12" fill="#B0C4CF" text-anchor="middle">sends to 3799</text>
  <rect x="640" y="110" width="230" height="170" rx="10" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="755" y="140" class="t" font-size="15" fill="#EAF2F6" text-anchor="middle" font-weight="700">Catalyst 9300</text>
  <rect x="664" y="160" width="182" height="40" rx="8" fill="none" stroke="#8BA2AE" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="755" y="185" class="m" font-size="12" fill="#8BA2AE" text-anchor="middle">listening: UDP 1700</text>
  <rect x="664" y="220" width="182" height="40" rx="8" fill="#8CE05E" stroke="#8CE05E" stroke-width="1"/>
  <text x="755" y="245" class="m" font-size="12" fill="#06202A" text-anchor="middle" font-weight="700">listening: UDP 3799</text>
  <path d="M234 180 L560 180" stroke="#8BA2AE" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#am)"/>
  <text x="400" y="168" class="t" font-size="12" fill="#8BA2AE" text-anchor="middle">default: nobody on 3799</text>
  <text x="590" y="186" class="t" font-size="22" fill="#8BA2AE" text-anchor="middle" font-weight="700">?</text>
  <path d="M234 240 L658 240" stroke="#8CE05E" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <text x="420" y="230" class="t" font-size="13" fill="#8CE05E" text-anchor="middle" font-weight="700">after one line: port 3799</text>
  <text x="30" y="320" class="t cap" font-size="12" fill="#8BA2AE">aaa server radius dynamic-author, port 3799. Cisco&#x27;s CoA guide gives 1700 as the default.</text>
</svg>
