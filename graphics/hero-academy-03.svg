<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Aruba Central prints 25 dBm and Juniper Mist prints 15 dBm per chain. The Aruba figure is already EIRP with the antenna in it. The Mist figure needs the antenna added, and the second chain's 3 dB only if the frame uses it, so it lands between 21 and 24 dBm. Ten decibels apart on screen, one to four in the air." font-family="Instrument Sans, -apple-system, Helvetica, Arial, sans-serif">
<title>Two screens, two different quantities</title>
<desc>Aruba Central prints 25 dBm, which already includes the antenna, so it stays 25. Juniper Mist prints 15 dBm per chain, which needs 6 dBi of antenna added and no MIMO gain on a beacon, reaching 21 dBm.</desc>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8BA2AE"/></marker></defs>
<text x="56.0" y="40.0" font-size="11" fill="#8BA2AE" text-anchor="start" font-weight="700" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" letter-spacing="2.0">WHAT THE SCREEN SAYS</text>
<text x="316.0" y="40.0" font-size="11" fill="#8BA2AE" text-anchor="start" font-weight="700" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" letter-spacing="2.0">WHAT IT MEANS</text>
<text x="700.0" y="40.0" font-size="11" fill="#8BA2AE" text-anchor="start" font-weight="700" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" letter-spacing="2.0">WHAT THE AIR SEES</text>
<text x="56.0" y="88.0" font-size="13" fill="#B0C4CF" text-anchor="start" font-weight="400">Aruba Central  &#183;  AP-735</text>
<rect x="52" y="98" width="4" height="48" rx="2" fill="#4FBDEA"/>
<text x="70.0" y="132.0" font-size="34" fill="#4FBDEA" text-anchor="start" font-weight="700" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">25</text>
<text x="122.0" y="132.0" font-size="13" fill="#8BA2AE" text-anchor="start" font-weight="400" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">dBm</text>
<text x="316.0" y="116.0" font-size="14" fill="#B0C4CF" text-anchor="start" font-weight="400">already EIRP. the 5.5 dBi antenna</text>
<text x="316.0" y="138.0" font-size="14" fill="#B0C4CF" text-anchor="start" font-weight="400">is inside the number. add nothing.</text>
<line x1="636" y1="122" x2="686" y2="122" stroke="#8BA2AE" stroke-width="2" marker-end="url(#ar)"/>
<text x="700.0" y="132.0" font-size="34" fill="#EAF2F6" text-anchor="start" font-weight="700" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">25</text>
<text x="752.0" y="132.0" font-size="13" fill="#8BA2AE" text-anchor="start" font-weight="400" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">dBm</text>
<line x1="52" y1="174" x2="848" y2="174" stroke="#FFFFFF" stroke-opacity="0.10"/>
<text x="56.0" y="196.0" font-size="13" fill="#B0C4CF" text-anchor="start" font-weight="400">Juniper Mist  &#183;  AP34</text>
<rect x="52" y="206" width="4" height="48" rx="2" fill="#F5A524"/>
<text x="70.0" y="240.0" font-size="34" fill="#F5A524" text-anchor="start" font-weight="700" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">15</text>
<text x="122.0" y="240.0" font-size="13" fill="#8BA2AE" text-anchor="start" font-weight="400" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">dBm/chain</text>
<text x="316.0" y="212.0" font-size="14" fill="#B0C4CF" text-anchor="start" font-weight="400">one chain, no antenna, no MIMO.</text>
<text x="316.0" y="234.0" font-size="14" fill="#B0C4CF" text-anchor="start" font-weight="400">add +6.0 dBi of antenna. the second</text>
<text x="316.0" y="256.0" font-size="14" fill="#B0C4CF" text-anchor="start" font-weight="400">chain&#8217;s 3 dB only if the frame uses it.</text>
<line x1="636" y1="230" x2="686" y2="230" stroke="#8BA2AE" stroke-width="2" marker-end="url(#ar)"/>
<text x="700.0" y="240.0" font-size="28" fill="#EAF2F6" text-anchor="start" font-weight="700" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">21 to 24</text>
<text x="842.0" y="240.0" font-size="13" fill="#8BA2AE" text-anchor="start" font-weight="400" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">dBm</text>
<text x="700.0" y="262.0" font-size="12" fill="#8BA2AE" text-anchor="start" font-weight="400" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">nobody documents which.</text>
<rect x="686" y="82" width="162" height="194" rx="12" fill="#8CE05E" fill-opacity="0.08" stroke="#8CE05E" stroke-opacity="0.30"/>
<text x="56.0" y="306.0" font-size="16" fill="#8CE05E" text-anchor="start" font-weight="600">Ten decibels apart on screen. One to four in the air.</text>
<text x="56.0" y="328.0" font-size="13" fill="#8BA2AE" text-anchor="start" font-weight="400">Both screens say dBm. Neither one says which dBm it means.</text>
</svg>
