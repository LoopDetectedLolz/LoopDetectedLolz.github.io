<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="The five autonomous actions HPE announced in May 2026 as a ladder. On the Mist side four rungs are filled with ship dates; on the Central side all five are hollow, still announced only. Central has radio auto-recovery and an improved Rogue DHCP alert beneath.">
<style>.ey{font:700 12px 'JetBrains Mono',ui-monospace,Menlo,monospace;fill:#8CE05E;letter-spacing:3px}.h{font:700 20px 'Instrument Sans',-apple-system,Helvetica,sans-serif;fill:#fff}.r{font:600 13px 'Instrument Sans',-apple-system,Helvetica,sans-serif;fill:#EAF2F6}.hd{font:600 11px 'JetBrains Mono',ui-monospace,Menlo,monospace;fill:#B0C4CF;letter-spacing:1.5px}.st{font:700 9.5px 'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:1px}.t{font:500 11px 'Instrument Sans',-apple-system,Helvetica,sans-serif;fill:#8BA2AE}.c{font:500 12px 'Instrument Sans',-apple-system,Helvetica,sans-serif;fill:#8BA2AE}</style>
<text class="ey" x="40" y="36">ANNOUNCED MAY 2026, FOR BOTH PLATFORMS</text><text class="h" x="40" y="62">Five autonomous actions. Where each one is, five months on.</text>
<text class="hd" x="330" y="92">JUNIPER MIST</text><text class="hd" x="620" y="92">NEW CENTRAL</text>
<line x1="40" y1="100" x2="860" y2="100" stroke="rgba(255,255,255,0.18)"/>
<text class="r" x="48" y="124">Dynamic Capacity Optimization</text>
<rect x="330" y="113" width="52" height="16" rx="8" fill="#8CE05E"/><text class="st" x="338" y="124" fill="#06202A">GA</text>
<text class="t" x="390" y="124">Apr 2026</text>
<rect x="620" y="113" width="92" height="16" rx="8" fill="none" stroke="#F5A524" stroke-dasharray="3 2"/><text class="st" x="628" y="124" fill="#F5A524">ANNOUNCED</text>
<text class="t" x="720" y="124">not in release notes</text>
<text class="r" x="48" y="154">Rogue DHCP Server</text>
<rect x="330" y="143" width="52" height="16" rx="8" fill="#8CE05E"/><text class="st" x="338" y="154" fill="#06202A">GA</text>
<text class="t" x="390" y="154">Apr 2026</text>
<rect x="620" y="143" width="92" height="16" rx="8" fill="none" stroke="#F5A524" stroke-dasharray="3 2"/><text class="st" x="628" y="154" fill="#F5A524">ANNOUNCED</text>
<text class="t" x="720" y="154">not in release notes</text>
<text class="r" x="48" y="184">Real-time DFS</text>
<rect x="330" y="173" width="52" height="16" rx="8" fill="#8CE05E"/><text class="st" x="338" y="184" fill="#06202A">GA</text>
<text class="t" x="390" y="184">Apr 2026, cannot be turned off</text>
<rect x="620" y="173" width="92" height="16" rx="8" fill="none" stroke="#F5A524" stroke-dasharray="3 2"/><text class="st" x="628" y="184" fill="#F5A524">ANNOUNCED</text>
<text class="t" x="720" y="184">not in release notes</text>
<text class="r" x="48" y="214">Missing VLAN</text>
<rect x="330" y="203" width="52" height="16" rx="8" fill="#8CE05E"/><text class="st" x="338" y="214" fill="#06202A">GA</text>
<text class="t" x="390" y="214">Sep 2026, off by default</text>
<rect x="620" y="203" width="92" height="16" rx="8" fill="none" stroke="#F5A524" stroke-dasharray="3 2"/><text class="st" x="628" y="214" fill="#F5A524">ANNOUNCED</text>
<text class="t" x="720" y="214">not in release notes</text>
<text class="r" x="48" y="244">Client Roaming Optimization</text>
<rect x="330" y="233" width="92" height="16" rx="8" fill="none" stroke="#F5A524" stroke-dasharray="3 2"/><text class="st" x="338" y="244" fill="#F5A524">ANNOUNCED</text>
<text class="t" x="430" y="244">no ship date anywhere</text>
<rect x="620" y="233" width="92" height="16" rx="8" fill="none" stroke="#F5A524" stroke-dasharray="3 2"/><text class="st" x="628" y="244" fill="#F5A524">ANNOUNCED</text>
<text class="t" x="720" y="244">not in release notes</text>
<line x1="40" y1="262" x2="860" y2="262" stroke="rgba(255,255,255,0.12)"/>
<text class="t" x="48" y="282">What Central does drive itself: radio auto-recovery (on by default) and AirMatch. Oct 15 improved the Rogue DHCP alert, which is a better alert, not a fix.</text>
<text class="c" x="40" y="326">Mist dates from Juniper product updates (Apr 15 and Sep 9, 2026). Central checked through the Oct 15, 2026 release notes.</text>
</svg>