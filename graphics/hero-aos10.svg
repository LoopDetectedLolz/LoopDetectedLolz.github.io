<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="AOS-8 to AOS-10: what carries over and what does not">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}.lbl{fill:#B0C4CF;font-size:12px}.big{fill:#fff;font-size:20px;font-weight:700}
    .eyebrow{fill:#8CE05E;font-size:11px;letter-spacing:2px;font-weight:600}.mono{font-family:JetBrains Mono,ui-monospace,Menlo,monospace;font-size:12px}
  </style>
  <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8CE05E"/></marker></defs>
  <text x="30" y="36" class="t eyebrow">"MIGRATION" IS DOING A LOT OF WORK IN THAT SENTENCE</text>
  <text x="30" y="66" class="t big">Config doesn't come along. You're standing up a new management plane.</text>
  <g class="t">
    <!-- AOS-8 box -->
    <rect x="30" y="95" width="300" height="220" rx="10" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)"/>
    <text x="50" y="122" fill="#EAF2F6" font-size="15" font-weight="700">AOS-8 · Mobility Conductor</text>
    <g font-size="13" fill="#B0C4CF">
      <text x="50" y="152">Internal user DB</text>
      <text x="50" y="176">AAA FastConnect</text>
      <text x="50" y="200">Hand-tuned RF (power, width, DFS)</text>
      <text x="50" y="224">AirWave + Conductor</text>
      <text x="50" y="248">RADIUS NAD = controller IP</text>
      <text x="50" y="272">IAP 8.x Central group</text>
      <text x="50" y="296">Native VLAN on AP switchport</text>
    </g>
    <!-- arrow -->
    <line x1="340" y1="205" x2="545" y2="205" stroke="#8CE05E" stroke-width="3" marker-end="url(#arr2)"/>
    <text x="442" y="192" text-anchor="middle" class="mono" fill="#8CE05E">ap convert active</text>
    <text x="442" y="228" text-anchor="middle" class="lbl">rebuild, not upgrade</text>
    <!-- AOS-10 box -->
    <rect x="560" y="95" width="310" height="220" rx="10" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)"/>
    <text x="580" y="122" fill="#EAF2F6" font-size="15" font-weight="700">AOS-10 · Central</text>
    <g font-size="13">
      <text x="580" y="152" fill="#8BA2AE">✕ gone: real RADIUS server required</text>
      <text x="580" y="176" fill="#8BA2AE">✕ gone: not supported</text>
      <text x="580" y="200" fill="#5ED2DA">→ AirMatch + ClientMatch, no knobs</text>
      <text x="580" y="224" fill="#5ED2DA">→ Central only</text>
      <text x="580" y="248" fill="#5ED2DA">→ gateway IP, or every AP in bridge</text>
      <text x="580" y="272" fill="#8BA2AE">✕ can't convert: build a new group</text>
      <text x="580" y="296" fill="#8BA2AE">✕ AP assumes untagged VID 1</text>
    </g>
  </g>
  <text x="30" y="332" class="t lbl">Pre-validate "dns error" on 8.10.0.5? AOS-253282 / AOS-253299, fixed in 8.10.0.11. Central handed back IPv6.</text>
</svg>
