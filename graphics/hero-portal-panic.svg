<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="A 72 character captive portal page name travels to the access point in bridge mode and panics it into a reboot loop">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .lbl{fill:#B0C4CF;font-size:11px}
    .big{fill:#fff;font-size:20px;font-weight:700}
    .eyebrow{fill:#8CE05E;font-size:11px;letter-spacing:2px;font-weight:600}
    .mono{font-family:JetBrains Mono,ui-monospace,Menlo,monospace;font-size:10px;fill:#5ED2DA}
    .hd{font-size:13px;font-weight:700}
  </style>
  <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ED2DA"/></marker>
  <marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8BA2AE"/></marker>
  </defs>

  <text x="30" y="36" class="t eyebrow">"THE ACCESS POINTS ARE FAULTY"</text>
  <text x="30" y="66" class="t big">Seventy two characters in a field nobody ever reads again.</text>

  <g class="t">
    <rect x="28" y="112" width="250" height="118" rx="12" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.14)"/>
    <text x="46" y="138" class="lbl" fill="#8BA2AE">CAPTIVE PORTAL PROFILE</text>
    <text x="46" y="166" class="hd" fill="#EAF2F6">Page name</text>
    <rect x="46" y="178" width="214" height="20" rx="4" fill="#5ED2DA" fill-opacity="0.18" stroke="#5ED2DA" stroke-opacity="0.45"/>
    <text x="153" y="192" class="t mono" text-anchor="middle">72 characters</text>
    <text x="46" y="218" class="lbl">Typed once. Never looked at again.</text>

    <path d="M278 171 L338 171" stroke="#5ED2DA" stroke-width="2" fill="none" marker-end="url(#pa)"/>
    <text x="308" y="160" class="lbl" font-size="10.5" text-anchor="middle" fill="#5ED2DA">bridge</text>

    <rect x="346" y="112" width="236" height="118" rx="12" fill="rgba(3,10,16,0.55)" stroke="#5ED2DA"/>
    <text x="364" y="138" class="lbl" fill="#8BA2AE">FORWARDING MODE</text>
    <text x="364" y="166" class="hd" fill="#5ED2DA">Bridge</text>
    <text x="364" y="188" class="lbl" fill="#EAF2F6">The AP is the sole policy</text>
    <text x="364" y="206" class="lbl" fill="#EAF2F6">enforcement point</text>
    <text x="364" y="224" class="lbl">so the AP holds the string</text>

    <path d="M582 171 L642 171" stroke="#5ED2DA" stroke-width="2" fill="none" marker-end="url(#pa)"/>

    <rect x="650" y="112" width="222" height="118" rx="12" fill="none" stroke="#8BA2AE" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="668" y="138" class="lbl" fill="#8BA2AE">ACCESS POINT</text>
    <text x="668" y="166" class="hd" fill="#B0C4CF">Kernel panic</text>
    <text x="668" y="188" class="lbl">Two to three minutes of life,</text>
    <text x="668" y="206" class="lbl">then round again</text>
    <path d="M846 214 a 16 16 0 1 1 -12 -15" stroke="#8BA2AE" stroke-width="1.6" fill="none"/>
    <path d="M828 192 L836 199 L827 204" stroke="#8BA2AE" stroke-width="1.6" fill="none"/>
  </g>

  <text x="30" y="290" class="t lbl" fill="#8BA2AE">Tunnel mode would never have found it, because the string never reaches the AP.</text>
  <text x="30" y="312" class="t lbl" fill="#8BA2AE">One engineer's field finding on 8.12.0.6 and 8.12.0.7. No defect ID exists.</text>
</svg>
