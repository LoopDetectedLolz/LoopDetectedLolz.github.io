<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="A WLAN wizard creates a role on the access point and never creates the matching role on the gateway, so tunneled client traffic arrives on a device that has no such role">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .big{font-size:20px;font-weight:700}
    .mono{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .eyebrow{font-size:11px;letter-spacing:2px;font-weight:600}
    .lane{font-size:10.5px;letter-spacing:2px}
    .box{font-size:13px;font-weight:600}
    .note{font-size:12px}
  </style>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8CE05E"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8BA2AE"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ED2DA"/></marker>
  </defs>

  <text x="30" y="34" class="t mono eyebrow" fill="#8CE05E">THREE FAILURES, ONE SHAPE</text>
  <text x="30" y="64" class="t big" fill="#ffffff">The wizard writes objects on one device class and calls it done.</text>

  <rect x="30" y="86" width="840" height="62" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="44" y="121" class="t mono lane" fill="#8BA2AE">CENTRAL</text>
  <rect x="250" y="98" width="190" height="38" rx="8" fill="#5ED2DA"/>
  <text x="345" y="122" class="t box" fill="#06202A" text-anchor="middle">WLAN wizard</text>

  <rect x="30" y="162" width="840" height="62" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="44" y="197" class="t mono lane" fill="#8BA2AE">ACCESS POINT</text>
  <rect x="250" y="174" width="250" height="38" rx="8" fill="#8CE05E"/>
  <text x="375" y="198" class="t box" fill="#06202A" text-anchor="middle">Role: guest, created here</text>

  <rect x="30" y="238" width="840" height="62" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="44" y="273" class="t mono lane" fill="#8BA2AE">GATEWAY</text>
  <rect x="250" y="250" width="250" height="38" rx="8" fill="none" stroke="#8BA2AE" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="375" y="274" class="t box" fill="#8BA2AE" text-anchor="middle">Role: guest, never created</text>

  <path d="M320 136 L320 172" stroke="#8CE05E" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M320 212 L320 248" stroke="#5ED2DA" stroke-width="1.8" fill="none" marker-end="url(#at)"/>
  <text x="306" y="234" class="t mono" font-size="10.5" fill="#5ED2DA" text-anchor="end">tunneled client traffic</text>

  <path d="M440 117 L600 117 L600 269 L512 269" stroke="#8BA2AE" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#ao)"/>
  <text x="620" y="273" class="t note" fill="#8BA2AE">the wizard does not write this one</text>
  <text x="30" y="324" class="t note" fill="#B0C4CF">Nothing errors. An object that was never created cannot refuse.</text>
</svg>
