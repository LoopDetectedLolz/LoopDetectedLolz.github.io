<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-label="Timeline of a protected management frame client reassociating while the access point still holds its old association: association request, status 30 with a comeback time, SA Query request to the old association, the SA Query timeout of about a second, then the second association request succeeds." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .mono{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .hd{font-size:15px;font-weight:700}
    .lane{font-size:10.5px;letter-spacing:2px}
    .f{font-size:11.5px}
    .fb{font-size:11.5px;font-weight:700}
    .note{font-size:12px}
  </style>
  <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8CE05E"/></marker>
  <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ED2DA"/></marker>
  <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8BA2AE"/></marker>
  </defs>
  <text x="15" y="26" class="t hd" fill="#ffffff">With PMF the AP has to prove the old session is dead before it lets the new one in.</text>

  <text x="15" y="58" class="t mono lane" fill="#8BA2AE">CLIENT, BACK FROM THE DEAD</text>
  <line x1="15" y1="66" x2="885" y2="66" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="15" y="196" class="t mono lane" fill="#8BA2AE">ACCESS POINT, STILL HOLDING THE OLD ASSOCIATION</text>
  <line x1="15" y1="204" x2="885" y2="204" stroke="#ffffff" stroke-opacity="0.14"/>

  <path d="M40 74 L40 178" stroke="#5ED2DA" stroke-width="1.6" fill="none" marker-end="url(#mt)"/>
  <text x="50" y="92" class="t fb" fill="#5ED2DA">1  association request</text>
  <text x="50" y="108" class="t f" fill="#B0C4CF">MFPC set, same MAC as the live session</text>

  <path d="M280 178 L280 74" stroke="#8BA2AE" stroke-width="1.6" fill="none" marker-end="url(#mo)"/>
  <text x="290" y="150" class="t fb" fill="#B0C4CF">2  status 30, try again later</text>
  <text x="290" y="166" class="t f" fill="#8BA2AE">with an association comeback time</text>

  <rect x="470" y="80" width="290" height="26" rx="6" fill="#F5A524" fill-opacity="0.12" stroke="#F5A524" stroke-width="1.2"/>
  <text x="615" y="98" class="t fb" fill="#FFC168" text-anchor="middle">4  SA Query timeout, default 1000 TU</text>
  <text x="615" y="122" class="t f" fill="#8BA2AE" text-anchor="middle">up to about a second. Sometimes this is the pause you feel.</text>

  <rect x="470" y="214" width="290" height="34" rx="8" fill="rgba(3,10,16,0.55)" stroke="#8BA2AE" stroke-dasharray="5 4"/>
  <text x="615" y="235" class="t f" fill="#B0C4CF" text-anchor="middle">3  SA Query request to the old association</text>
  <path d="M470 231 L432 231" stroke="#8BA2AE" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
  <text x="392" y="235" class="t f" fill="#8BA2AE" text-anchor="middle">...no answer</text>

  <path d="M780 74 L780 178" stroke="#8CE05E" stroke-width="1.6" fill="none" marker-end="url(#mg)"/>
  <text x="790" y="92" class="t fb" fill="#8CE05E">5  assoc again</text>
  <text x="790" y="108" class="t f" fill="#B0C4CF">old one gone,</text><text x="790" y="124" class="t f" fill="#B0C4CF">success</text>

  <text x="15" y="264" class="t note" fill="#8BA2AE">Without PMF, step 1 simply replaces the old association. That convenience is exactly the forgery PMF exists to stop.</text>
</svg>
