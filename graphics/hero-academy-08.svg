<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Lesson 8: Joining a network. A vertical ladder of the join sequence. Left column, the frames between client and AP: probe, 802.11 authentication, association, EAPOL-Start and EAP identity, the EAP method round trips, EAP-Success, the 4-way handshake highlighted, DHCP, then a green first data frame. Right column, the RADIUS leg to ClearPass: Access-Request, N Access-Challenges, Access-Accept carrying the PMK material, with a note that PSK has no RADIUS leg. Caption: every rung is a place it can fail.">
  <defs>
    <style>
      .eb { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1.5px; fill: #F5A524; }
      .hl { font-family: 'Instrument Sans', sans-serif; font-size: 22px; font-weight: 600; fill: #EAF2F6; }
      .t  { font-family: 'Instrument Sans', sans-serif; font-size: 12px; fill: #B0C4CF; }
      .tw { font-family: 'Instrument Sans', sans-serif; font-size: 12px; fill: #EAF2F6; }
      .ts { font-family: 'Instrument Sans', sans-serif; font-size: 11px; fill: #8BA2AE; }
      .mh { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.5px; fill: #8BA2AE; }
      .m  { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #EAF2F6; }
      .mo { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #F5A524; font-weight: 600; }
      .mt { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #5ED2DA; }
      .mg { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #8CE05E; font-weight: 600; }
      .cap { font-family: 'Instrument Sans', sans-serif; font-size: 13px; fill: #F5A524; }
      .box { fill: rgba(0,0,0,0.45); stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .rail { stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .rung { stroke: rgba(255,255,255,0.25); stroke-width: 1.5; }
      .rungo { stroke: #F5A524; stroke-width: 2; }
      .rungg { stroke: #8CE05E; stroke-width: 2; }
      .link { stroke: #5ED2DA; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
    </style>
  </defs>

  <text x="24" y="36" class="eb">LESSON 8: JOINING A NETWORK</text>
  <text x="24" y="66" class="hl">Connected is not one event. It's a ladder, and every rung can fail.</text>

  <rect x="24" y="82" width="528" height="214" rx="8" class="box"/>
  <text x="40" y="98" class="mh">CLIENT AND AP, OVER THE AIR</text>
  <text x="536" y="98" text-anchor="end" class="mh">FRAMES</text>
  <line x1="48" y1="110" x2="48" y2="270" class="rail"/>
  <line x1="74" y1="110" x2="74" y2="270" class="rail"/>
  <rect x="572" y="82" width="304" height="214" rx="8" class="box"/>
  <text x="588" y="98" class="mh">RADIUS LEG TO CLEARPASS</text>
  <line x1="48" y1="116" x2="74" y2="116" class="rung"/>
  <text x="88" y="120" class="tw">Probe request / response</text>
  <text x="536" y="120" text-anchor="end" class="m">2</text>
  <line x1="48" y1="136" x2="74" y2="136" class="rung"/>
  <text x="88" y="140" class="tw">802.11 authentication (SAE: 4)</text>
  <text x="536" y="140" text-anchor="end" class="m">2</text>
  <line x1="48" y1="156" x2="74" y2="156" class="rung"/>
  <text x="88" y="160" class="tw">Association request / response</text>
  <text x="536" y="160" text-anchor="end" class="m">2</text>
  <line x1="48" y1="176" x2="74" y2="176" class="rung"/>
  <text x="88" y="180" class="tw">EAPOL-Start, EAP identity</text>
  <text x="536" y="180" text-anchor="end" class="m">3</text>
  <path d="M552 176 C 562 176 562 176 572 176" class="link"/>
  <circle cx="572" cy="176" r="2.5" fill="#5ED2DA"/>
  <text x="588" y="180" class="mt">Access-Request</text>
  <line x1="48" y1="196" x2="74" y2="196" class="rung"/>
  <text x="88" y="200" class="tw">EAP-TLS or PEAP round trips</text>
  <text x="536" y="200" text-anchor="end" class="m">2N</text>
  <path d="M552 196 C 562 196 562 196 572 196" class="link"/>
  <circle cx="572" cy="196" r="2.5" fill="#5ED2DA"/>
  <text x="588" y="200" class="mt">Access-Challenge x N</text>
  <line x1="48" y1="216" x2="74" y2="216" class="rung"/>
  <text x="88" y="220" class="tw">EAP-Success</text>
  <text x="536" y="220" text-anchor="end" class="m">1</text>
  <path d="M552 216 C 562 216 562 216 572 216" class="link"/>
  <circle cx="572" cy="216" r="2.5" fill="#5ED2DA"/>
  <text x="588" y="220" class="mt">Access-Accept + PMK material</text>
  <rect x="32" y="227" width="512" height="20" rx="4" fill="rgba(245,165,36,0.10)" stroke="rgba(245,165,36,0.35)" stroke-width="1"/>
  <line x1="48" y1="236" x2="74" y2="236" class="rungo"/>
  <text x="88" y="240" class="mo">4-way handshake  M1 M2 M3 M4</text>
  <text x="536" y="240" text-anchor="end" class="mo">4</text>
  <line x1="48" y1="256" x2="74" y2="256" class="rung"/>
  <text x="88" y="260" class="tw">DHCP discover, offer, request, ack</text>
  <text x="536" y="260" text-anchor="end" class="m">4</text>
  <line x1="48" y1="276" x2="74" y2="276" class="rungg"/>
  <circle cx="61" cy="276" r="4" fill="#8CE05E"/>
  <text x="88" y="280" class="mg">First data frame the user asked for</text>
  <text x="536" y="280" text-anchor="end" class="mg">PSK 14 / EAP 18+2N</text>
  <text x="588" y="240" class="ts">Login Status: Accept, Reject or Timeout</text>
  <text x="588" y="260" class="ts">No row at all: it never got in the door</text>
  <text x="588" y="280" class="ts">PSK: no RADIUS leg. PMK from the passphrase.</text>
  <text x="24" y="322" class="cap">Every rung is a place it can fail, and each one fails on a different screen. Learn the order.</text>
</svg>
