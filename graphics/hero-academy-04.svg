<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Lesson 4: Modulation and data rates. Three constellation diagrams, BPSK, 16-QAM and 256-QAM, showing points packing closer together as bits per symbol rise, beside a table of six Wi-Fi 6 MCS rows with modulation, coding rate, data rate at 20 MHz one stream and 80 MHz two streams, and the IEEE minimum receiver sensitivity. Caption: neither Central nor Mist shows the MCS, they show the Mbps, so read the table backwards.">
