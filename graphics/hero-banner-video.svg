<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Three film frames: a helix leaving a Yagi, a constellation with hits, and a chat bubble arriving late, with the four things the banner models underneath" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}.big{fill:#fff;font-size:20px;font-weight:700}
    .eyebrow{fill:#8CE05E;font-size:11px;letter-spacing:2px;font-weight:600}.mono{font-family:JetBrains Mono,ui-monospace,Menlo,monospace;font-size:11px}
    .frame{fill:#0B1622;stroke:rgba(255,255,255,0.14)}.lbl{fill:#B0C4CF;font-size:12px}.mut{fill:#8BA2AE;font-size:11px}.wh{fill:#fff;font-size:12px;font-weight:600}
  </style></defs>
  <text x="30" y="36" class="t eyebrow">THE BANNER, EXPLAINED IN FOUR MINUTES</text>
  <text x="30" y="66" class="t big">A real frame, a link budget, one reflection, and a Teams call you can break.</text>

  <!-- film strip -->
  <rect x="30" y="86" width="840" height="150" rx="8" fill="#08111B" stroke="rgba(255,255,255,0.10)"/>
  <g fill="rgba(255,255,255,0.10)">
    <rect x="42" y="92" width="10" height="7" rx="2"/><rect x="42" y="223" width="10" height="7" rx="2"/>
    <rect x="848" y="92" width="10" height="7" rx="2"/><rect x="848" y="223" width="10" height="7" rx="2"/>
  </g>
  <g transform="translate(40,102)">
    <rect x="0" y="0" width="0" height="0"/>
    <!-- 1: helix from the Yagi to the plane -->
    <rect x="20" y="0" width="256" height="118" rx="6" class="frame"/>
    <g stroke="#B0C4CF" stroke-width="2" stroke-linecap="round"><line x1="44" y1="59" x2="88" y2="59"/><line x1="52" y1="43" x2="52" y2="75"/><line x1="66" y1="47" x2="66" y2="71"/><line x1="78" y1="49" x2="78" y2="69"/></g>
    <rect x="57" y="49" width="4" height="20" rx="2" fill="none" stroke="#4FBDEA" stroke-width="2"/>
    <path d="M90 59 C120 30 130 88 160 59 S200 30 230 59 S250 92 262 59" fill="none" stroke="#4FBDEA" stroke-width="2"/>
    <path d="M90 59 C120 88 130 30 160 59 S200 88 230 59 S250 26 262 59" fill="none" stroke="#5ED2DA" stroke-width="1.4" opacity="0.7"/>
    <rect x="256" y="24" width="6" height="70" rx="2" fill="rgba(79,189,234,0.18)" stroke="rgba(255,255,255,0.3)"/>
    <text x="148" y="108" class="t mono" fill="#8BA2AE" text-anchor="middle">one particle = one symbol</text>
    <!-- 2: constellation with hits -->
    <rect x="292" y="0" width="256" height="118" rx="6" class="frame"/>
    <g stroke="rgba(255,255,255,0.12)"><line x1="420" y1="8" x2="420" y2="110"/><line x1="320" y1="59" x2="520" y2="59"/></g>
    <g fill="#8CE05E">
      <circle cx="356" cy="30" r="3"/><circle cx="388" cy="31" r="3"/><circle cx="452" cy="29" r="3"/><circle cx="484" cy="32" r="3"/>
      <circle cx="357" cy="59" r="3"/><circle cx="389" cy="58" r="3"/><circle cx="453" cy="60" r="3"/><circle cx="485" cy="59" r="3"/>
      <circle cx="355" cy="88" r="3"/><circle cx="388" cy="89" r="3"/><circle cx="452" cy="87" r="3"/>
    </g>
    <circle cx="470" cy="84" r="3.4" fill="#F5A524"/><circle cx="470" cy="84" r="8" fill="none" stroke="#F5A524" stroke-dasharray="2 2"/>
    <text x="420" y="108" class="t mono" fill="#8BA2AE" text-anchor="middle">orange crossed a cell: CRC fails</text>
    <!-- 3: chat bubble late -->
    <rect x="564" y="0" width="256" height="118" rx="6" class="frame"/>
    <rect x="590" y="18" width="150" height="30" rx="10" fill="rgba(255,255,255,0.08)"/><text x="602" y="37" class="t lbl">Can you hear me?</text>
    <rect x="640" y="60" width="164" height="30" rx="10" fill="rgba(79,189,234,0.18)"/><text x="652" y="79" class="t lbl">Microwave. Watch it.</text>
    <text x="692" y="108" class="t mono" fill="#F5A524" text-anchor="middle">delivered 200 ms late, 1 retransmit</text>
  </g>

  <!-- four things -->
  <g class="t" transform="translate(30,262)">
    <text x="0" y="0" class="wh">The frame</text><text x="0" y="16" class="mut">118 bytes from a capture, LSB first</text>
    <text x="215" y="0" class="wh">The budget</text><text x="215" y="16" class="mut">20 dBm, walls, noise floor by width</text>
    <text x="430" y="0" class="wh">The echo</text><text x="430" y="16" class="mut">phase flip, per-subcarrier fade</text>
    <text x="645" y="0" class="wh">The apps</text><text x="645" y="16" class="mut">UDP loses packets, TCP arrives late</text>
  </g>
  <text x="30" y="326" class="t mut">Every number in the video is the one the banner computes; the caveats are listed in its explainer.</text>
</svg>
