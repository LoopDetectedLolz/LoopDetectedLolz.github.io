<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="One day of 15-minute snapshot polls shown as ticks along a timeline: two overnight gaps where the laptop slept, a cluster of retried sign-ins during work hours, and the moment the token started being cached after which every poll succeeded first time" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.pd-t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
.pd-m{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
.pd-box{fill:rgba(3,10,16,0.55);stroke:rgba(255,255,255,0.12)}
@media (prefers-reduced-motion:no-preference){
 .pd-cur{animation:pdc 12s linear infinite}
 @keyframes pdc{from{transform:translateX(0)}to{transform:translateX(780px)}}
}
</style>
<text x="40" y="36" class="pd-t" font-size="12" font-weight="700" letter-spacing="2" fill="#8CE05E">ONE DAY OF SNAPSHOTS, NOV 3 TO NOV 4</text>
<text x="40" y="66" class="pd-t" font-size="20" font-weight="600" fill="#EAF2F6">A monitor on a laptop inherits the laptop's day</text>

<!-- timeline frame -->
<rect x="40" y="100" width="820" height="200" rx="12" class="pd-box"/>
<line x1="60" y1="200" x2="840" y2="200" stroke="rgba(255,255,255,0.18)"/>
<!-- hour marks: 60 + hour*32.5 (24h over 780px) -->
<g class="pd-m" font-size="10" fill="#8BA2AE">
<text x="60" y="290" text-anchor="middle">noon</text>
<text x="255" y="290" text-anchor="middle">6 pm</text>
<text x="450" y="290" text-anchor="middle">midnight</text>
<text x="645" y="290" text-anchor="middle">6 am</text>
<text x="840" y="290" text-anchor="middle">noon</text>
</g>
<g stroke="rgba(255,255,255,0.12)"><line x1="255" y1="192" x2="255" y2="208"/><line x1="450" y1="192" x2="450" y2="208"/><line x1="645" y1="192" x2="645" y2="208"/></g>

<!-- good polls: afternoon/evening Nov 3, 12:00 to 23:26 -->
<g stroke="#8CE05E" stroke-width="2">
<line x1="60" y1="182" x2="60" y2="218"/><line x1="68" y1="182" x2="68" y2="218"/><line x1="76" y1="182" x2="76" y2="218"/><line x1="84" y1="182" x2="84" y2="218"/><line x1="92" y1="182" x2="92" y2="218"/><line x1="100" y1="182" x2="100" y2="218"/><line x1="108" y1="182" x2="108" y2="218"/><line x1="116" y1="182" x2="116" y2="218"/><line x1="124" y1="182" x2="124" y2="218"/><line x1="132" y1="182" x2="132" y2="218"/><line x1="140" y1="182" x2="140" y2="218"/><line x1="148" y1="182" x2="148" y2="218"/><line x1="156" y1="182" x2="156" y2="218"/><line x1="164" y1="182" x2="164" y2="218"/><line x1="172" y1="182" x2="172" y2="218"/><line x1="180" y1="182" x2="180" y2="218"/><line x1="188" y1="182" x2="188" y2="218"/><line x1="196" y1="182" x2="196" y2="218"/><line x1="204" y1="182" x2="204" y2="218"/><line x1="212" y1="182" x2="212" y2="218"/><line x1="220" y1="182" x2="220" y2="218"/><line x1="228" y1="182" x2="228" y2="218"/><line x1="236" y1="182" x2="236" y2="218"/><line x1="244" y1="182" x2="244" y2="218"/><line x1="252" y1="182" x2="252" y2="218"/><line x1="260" y1="182" x2="260" y2="218"/><line x1="268" y1="182" x2="268" y2="218"/><line x1="276" y1="182" x2="276" y2="218"/><line x1="284" y1="182" x2="284" y2="218"/><line x1="292" y1="182" x2="292" y2="218"/><line x1="300" y1="182" x2="300" y2="218"/><line x1="308" y1="182" x2="308" y2="218"/><line x1="316" y1="182" x2="316" y2="218"/><line x1="324" y1="182" x2="324" y2="218"/><line x1="332" y1="182" x2="332" y2="218"/><line x1="340" y1="182" x2="340" y2="218"/><line x1="348" y1="182" x2="348" y2="218"/><line x1="356" y1="182" x2="356" y2="218"/><line x1="364" y1="182" x2="364" y2="218"/><line x1="372" y1="182" x2="372" y2="218"/><line x1="380" y1="182" x2="380" y2="218"/><line x1="388" y1="182" x2="388" y2="218"/><line x1="396" y1="182" x2="396" y2="218"/><line x1="404" y1="182" x2="404" y2="218"/><line x1="412" y1="182" x2="412" y2="218"/><line x1="420" y1="182" x2="420" y2="218"/><line x1="428" y1="182" x2="428" y2="218"/>
</g>
<!-- gap 1: 23:26 to 04:08 (x 431 to 582); one poll 04:08 then gap 2 to 08:53 (x 582 to 737) -->
<rect x="431" y="150" width="151" height="100" fill="none" stroke="#8BA2AE" stroke-dasharray="4 4" rx="6"/>
<text x="506" y="140" text-anchor="middle" class="pd-t" font-size="11" fill="#8BA2AE">asleep, 4.7 h</text>
<line x1="582" y1="182" x2="582" y2="218" stroke="#8CE05E" stroke-width="2"/>
<rect x="585" y="150" width="152" height="100" fill="none" stroke="#8BA2AE" stroke-dasharray="4 4" rx="6"/>
<text x="661" y="140" text-anchor="middle" class="pd-t" font-size="11" fill="#8BA2AE">asleep, 4.8 h</text>
<!-- morning Nov 4: 08:53 on, mixed good and failed (sign-in host) -->
<g stroke-width="2">
<line x1="737" y1="182" x2="737" y2="218" stroke="#8CE05E"/>
<line x1="745" y1="182" x2="745" y2="218" stroke="#8CE05E"/>
<line x1="753" y1="176" x2="753" y2="224" stroke="#B0C4CF" stroke-dasharray="3 3"/>
<line x1="761" y1="182" x2="761" y2="218" stroke="#8CE05E"/>
<line x1="769" y1="176" x2="769" y2="224" stroke="#B0C4CF" stroke-dasharray="3 3"/>
<line x1="777" y1="182" x2="777" y2="218" stroke="#8CE05E"/>
<line x1="785" y1="176" x2="785" y2="224" stroke="#B0C4CF" stroke-dasharray="3 3"/>
<line x1="793" y1="182" x2="793" y2="218" stroke="#8CE05E"/>
<line x1="801" y1="176" x2="801" y2="224" stroke="#B0C4CF" stroke-dasharray="3 3"/>
<line x1="809" y1="182" x2="809" y2="218" stroke="#8CE05E"/>
<line x1="817" y1="182" x2="817" y2="218" stroke="#8CE05E"/>
<line x1="825" y1="176" x2="825" y2="224" stroke="#B0C4CF" stroke-dasharray="3 3"/>
<line x1="833" y1="182" x2="833" y2="218" stroke="#8CE05E"/>
</g>
<text x="788" y="140" text-anchor="middle" class="pd-t" font-size="11" fill="#B0C4CF">work hours, Nov 4:</text>
<text x="788" y="154" text-anchor="middle" class="pd-t" font-size="11" fill="#B0C4CF">29 of 75 polls failed</text>
<!-- cursor -->
<line x1="60" y1="108" x2="60" y2="292" stroke="#4FBDEA" stroke-width="1.5" class="pd-cur" opacity=".7"/>

<!-- legend -->
<g transform="translate(40,322)">
<line x1="0" y1="10" x2="0" y2="30" stroke="#8CE05E" stroke-width="2"/><text x="10" y="24" class="pd-t" font-size="11" fill="#B0C4CF">snapshot saved</text>
<line x1="140" y1="8" x2="140" y2="32" stroke="#B0C4CF" stroke-width="2" stroke-dasharray="3 3"/><text x="150" y="24" class="pd-t" font-size="11" fill="#B0C4CF">poll failed (could not reach the sign-in host)</text>
<rect x="440" y="10" width="20" height="20" fill="none" stroke="#8BA2AE" stroke-dasharray="4 4" rx="3"/><text x="468" y="24" class="pd-t" font-size="11" fill="#B0C4CF">no polls, laptop asleep</text>
</g>

<!-- the fix -->
<rect x="40" y="372" width="820" height="118" rx="12" class="pd-box"/>
<text x="56" y="398" class="pd-t" font-size="13" font-weight="600" fill="#EAF2F6">The fix was arithmetic, not networking</text>
<text x="56" y="422" class="pd-t" font-size="12" fill="#B0C4CF">Tokens last 2 hours. The poller runs every 15 minutes. It was signing in 96 times a day for a job that needs 8.</text>
<text x="56" y="442" class="pd-t" font-size="12" fill="#B0C4CF">Cache the token next to the secret, same file permissions, refresh 5 minutes before it expires, retry the sign-in a few times.</text>
<text x="56" y="470" class="pd-m" font-size="11" fill="#8CE05E">after: 4 runs in a row, 0 retries, VPN still on</text>
<text x="40" y="510" class="pd-t" font-size="11" fill="#8BA2AE">Ticks are real polls from the snapshot database. Only the fail pattern in work hours is simplified to fit.</text>
</svg>
