<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Six questions on the left map to six MCP tools in the middle and the New Central API endpoints they call on the right; every call is a GET" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.tm-t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
.tm-m{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
.tm-box{fill:rgba(3,10,16,0.55);stroke:rgba(255,255,255,0.12)}
.tm-l{stroke:#5ED2DA;stroke-width:1.2;fill:none;opacity:.8}
@media (prefers-reduced-motion:no-preference){
 .tm-l{stroke-dasharray:6 6;animation:tml 2.4s linear infinite}
 @keyframes tml{to{stroke-dashoffset:-24}}
}
</style>
<text x="40" y="36" class="tm-t" font-size="12" font-weight="700" letter-spacing="2" fill="#8CE05E">QUESTION, TOOL, ENDPOINT</text>
<text x="40" y="66" class="tm-t" font-size="20" font-weight="600" fill="#EAF2F6">What each question turns into on the wire</text>
<text x="40" y="92" class="tm-t" font-size="11" fill="#B0C4CF">Questions</text>
<text x="350" y="92" class="tm-t" font-size="11" fill="#B0C4CF">MCP tool</text>
<text x="590" y="92" class="tm-t" font-size="11" fill="#B0C4CF">New Central v1 endpoints (all GET)</text>

<g id="r1">
<rect x="40" y="104" width="270" height="44" rx="8" class="tm-box"/><text x="54" y="131" class="tm-t" font-size="12" fill="#EAF2F6">Is anything offline or out of sync?</text>
<rect x="350" y="104" width="200" height="44" rx="8" class="tm-box"/><text x="450" y="131" text-anchor="middle" class="tm-m" font-size="12" fill="#4FBDEA">device_status</text>
<rect x="590" y="104" width="270" height="44" rx="8" class="tm-box"/><text x="604" y="131" class="tm-m" font-size="10" fill="#B0C4CF">/network-monitoring/v1/devices</text>
<path d="M310 126 H350" class="tm-l"/><path d="M550 126 H590" class="tm-l"/>
</g>
<g id="r2">
<rect x="40" y="164" width="270" height="56" rx="8" class="tm-box"/><text x="54" y="187" class="tm-t" font-size="12" fill="#EAF2F6">Who is on, and who is failing?</text><text x="54" y="206" class="tm-t" font-size="10" fill="#8BA2AE">three calls, because reasons live elsewhere</text>
<rect x="350" y="164" width="200" height="56" rx="8" class="tm-box"/><text x="450" y="197" text-anchor="middle" class="tm-m" font-size="12" fill="#4FBDEA">client_health</text>
<rect x="590" y="164" width="270" height="56" rx="8" class="tm-box"/><text x="604" y="183" class="tm-m" font-size="10" fill="#B0C4CF">/network-monitoring/v1/clients</text><text x="604" y="197" class="tm-m" font-size="10" fill="#B0C4CF">/.../sites-client-health</text><text x="604" y="211" class="tm-m" font-size="10" fill="#B0C4CF">/.../client-onboarding-stage/export</text>
<path d="M310 192 H350" class="tm-l"/><path d="M550 192 H590" class="tm-l"/>
</g>
<g id="r3">
<rect x="40" y="236" width="270" height="56" rx="8" class="tm-box"/><text x="54" y="259" class="tm-t" font-size="12" fill="#EAF2F6">Does any radio need a look?</text><text x="54" y="278" class="tm-t" font-size="10" fill="#8BA2AE">noise, utilization, interference; no per-radio SNR</text>
<rect x="350" y="236" width="200" height="56" rx="8" class="tm-box"/><text x="450" y="269" text-anchor="middle" class="tm-m" font-size="12" fill="#4FBDEA">rf_snapshot</text>
<rect x="590" y="236" width="270" height="56" rx="8" class="tm-box"/><text x="604" y="259" class="tm-m" font-size="10" fill="#B0C4CF">/network-monitoring/v1/radios</text><text x="604" y="277" class="tm-m" font-size="10" fill="#B0C4CF">/network-services/v1/airmatch-ap-neighbor-list</text>
<path d="M310 264 H350" class="tm-l"/><path d="M550 264 H590" class="tm-l"/>
</g>
<g id="r4">
<rect x="40" y="308" width="270" height="56" rx="8" class="tm-box"/><text x="54" y="331" class="tm-t" font-size="12" fill="#EAF2F6">What is alarming, and who changed what?</text><text x="54" y="350" class="tm-t" font-size="10" fill="#8BA2AE">alerts page at 100, audits by offset</text>
<rect x="350" y="308" width="200" height="56" rx="8" class="tm-box"/><text x="450" y="341" text-anchor="middle" class="tm-m" font-size="12" fill="#4FBDEA">alerts_and_audit</text>
<rect x="590" y="308" width="270" height="56" rx="8" class="tm-box"/><text x="604" y="331" class="tm-m" font-size="10" fill="#B0C4CF">/network-notifications/v1/alerts</text><text x="604" y="349" class="tm-m" font-size="10" fill="#B0C4CF">/network-services/v1/audits</text>
<path d="M310 336 H350" class="tm-l"/><path d="M550 336 H590" class="tm-l"/>
</g>
<g id="r5">
<rect x="40" y="380" width="270" height="44" rx="8" class="tm-box"/><text x="54" y="407" class="tm-t" font-size="12" fill="#EAF2F6">Anything weird since the cutover?</text>
<rect x="350" y="380" width="200" height="44" rx="8" class="tm-box"/><text x="450" y="407" text-anchor="middle" class="tm-m" font-size="12" fill="#8CE05E">day_one_report</text>
<rect x="590" y="380" width="270" height="44" rx="8" class="tm-box"/><text x="604" y="407" class="tm-t" font-size="11" fill="#B0C4CF">runs the four tools above, one summary</text>
<path d="M310 402 H350" class="tm-l"/><path d="M550 402 H590" class="tm-l"/>
</g>
<g id="r6">
<rect x="40" y="440" width="270" height="44" rx="8" class="tm-box"/><text x="54" y="467" class="tm-t" font-size="12" fill="#EAF2F6">What changed since yesterday?</text>
<rect x="350" y="440" width="200" height="44" rx="8" class="tm-box"/><text x="450" y="467" text-anchor="middle" class="tm-m" font-size="12" fill="#8CE05E">changes_since</text>
<rect x="590" y="440" width="270" height="44" rx="8" class="tm-box" stroke-dasharray="4 3"/><text x="604" y="461" class="tm-t" font-size="11" fill="#B0C4CF">no API call: reads the local snapshots</text><text x="604" y="477" class="tm-m" font-size="10" fill="#8BA2AE">sqlite, one row set per 15 min</text>
<path d="M310 462 H350" class="tm-l"/><path d="M550 462 H590" class="tm-l"/>
</g>
<text x="40" y="508" class="tm-t" font-size="11" fill="#8BA2AE">Twelve paths on the allowlist. A request for anything else is refused before it leaves the laptop.</text>
</svg>
