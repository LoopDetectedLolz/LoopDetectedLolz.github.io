<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="What crossed between the platforms. From Mist to Central: LEM became the Application Experience Predictor (Jan 2026, select availability). From Central to Mist: AOS-CX 5420, 6300 and 6400 switches (Sep 2026). Shared by both: the AP 723H (May 2026) and Marvis as the AI engine. Promised but not shipped: Marvis Actions in Central, agentic mesh in Mist.">
<style>.ey{font:700 12px 'JetBrains Mono',ui-monospace,Menlo,monospace;fill:#8CE05E;letter-spacing:3px}.h{font:700 20px 'Instrument Sans',-apple-system,Helvetica,sans-serif;fill:#fff}.l{font:700 14px 'Instrument Sans',-apple-system,Helvetica,sans-serif;fill:#EAF2F6}.s{font:500 12px 'Instrument Sans',-apple-system,Helvetica,sans-serif;fill:#B0C4CF}.m{font:600 10.5px 'JetBrains Mono',ui-monospace,Menlo,monospace;fill:#8BA2AE;letter-spacing:1px}.c{font:500 12px 'Instrument Sans',-apple-system,Helvetica,sans-serif;fill:#8BA2AE}.box{fill:rgba(3,10,16,0.55);stroke:rgba(255,255,255,0.12)}</style>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5ED2DA"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8CE05E"/></marker></defs>
