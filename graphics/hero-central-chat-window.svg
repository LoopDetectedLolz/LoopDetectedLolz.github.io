<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="A question typed into a chat window travels through a small read-only MCP server with a padlock into the New Central cloud, and the answer comes back; a snapshot jar beside the server collects a copy every 15 minutes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.hc-t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
.hc-m{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
.hc-box{fill:rgba(3,10,16,0.55);stroke:rgba(255,255,255,0.12)}
@media (prefers-reduced-motion:no-preference){
 .hc-q{animation:hcq 6s cubic-bezier(.32,.72,0,1) infinite}
 .hc-a{animation:hca 6s cubic-bezier(.32,.72,0,1) infinite}
 .hc-drop{animation:hcd 3s linear infinite}
 @keyframes hcq{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%{transform:translateX(560px);opacity:1}46%{opacity:0}100%{transform:translateX(560px);opacity:0}}
 @keyframes hca{0%,50%{transform:translateX(0);opacity:0}56%{opacity:1}90%{transform:translateX(-560px);opacity:1}96%,100%{opacity:0;transform:translateX(-560px)}}
 @keyframes hcd{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(22px);opacity:0}}
}
</style>
<text x="40" y="36" class="hc-t" font-size="12" font-weight="700" letter-spacing="2" fill="#8CE05E">NEW CENTRAL, ASKED IN PLAIN ENGLISH</text>
<text x="40" y="66" class="hc-t" font-size="22" font-weight="600" fill="#EAF2F6">A read-only MCP server between the question and the API</text>

<!-- chat window -->
<rect x="40" y="100" width="230" height="150" rx="12" class="hc-box"/>
<text x="56" y="124" class="hc-t" font-size="12" fill="#B0C4CF">Chat</text>
<rect x="56" y="136" width="198" height="34" rx="8" fill="rgba(79,189,234,0.16)" stroke="rgba(79,189,234,0.5)"/>
<text x="66" y="157" class="hc-t" font-size="12" fill="#EAF2F6">anything weird since the cutover?</text>
<rect x="56" y="180" width="198" height="52" rx="8" fill="rgba(140,224,94,0.12)" stroke="rgba(140,224,94,0.45)"/>
<text x="66" y="198" class="hc-t" font-size="11" fill="#EAF2F6">2 devices online, 15 clients, 0 failed.</text>
<text x="66" y="214" class="hc-t" font-size="11" fill="#EAF2F6">2.4 GHz moved ch 11 to 1, nobody did it.</text>

<!-- server -->
<rect x="360" y="118" width="180" height="114" rx="12" class="hc-box"/>
<text x="450" y="142" text-anchor="middle" class="hc-t" font-size="13" font-weight="600" fill="#EAF2F6">MCP server</text>
<text x="450" y="160" text-anchor="middle" class="hc-m" font-size="10" fill="#8BA2AE">6 tools, 12 GET paths</text>
<!-- padlock -->
<rect x="434" y="184" width="32" height="24" rx="4" fill="#8CE05E"/>
<path d="M441 184 v-8 a9 9 0 0 1 18 0 v8" fill="none" stroke="#8CE05E" stroke-width="4"/>
<circle cx="450" cy="195" r="3" fill="#06202A"/>
<text x="450" y="226" text-anchor="middle" class="hc-t" font-size="10" fill="#B0C4CF">read-only</text>

<!-- cloud -->
<path d="M690 150 a30 30 0 0 1 56 -12 a26 26 0 0 1 48 10 a24 24 0 0 1 -4 48 h-104 a26 26 0 0 1 4 -46z" class="hc-box"/>
<text x="748" y="176" text-anchor="middle" class="hc-t" font-size="13" font-weight="600" fill="#EAF2F6">New Central</text>
<text x="748" y="192" text-anchor="middle" class="hc-m" font-size="10" fill="#8BA2AE">ca1.api, 10 calls/s</text>

<!-- rails -->
<line x1="270" y1="160" x2="360" y2="160" stroke="#5ED2DA" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="540" y1="160" x2="690" y2="160" stroke="#5ED2DA" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="690" y1="200" x2="540" y2="200" stroke="#8CE05E" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="360" y1="200" x2="270" y2="200" stroke="#8CE05E" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="315" y="150" text-anchor="middle" class="hc-t" font-size="10" fill="#8BA2AE">question</text>
<text x="315" y="216" text-anchor="middle" class="hc-t" font-size="10" fill="#8BA2AE">answer</text>
<text x="615" y="150" text-anchor="middle" class="hc-m" font-size="10" fill="#8BA2AE">GET + token</text>
<text x="615" y="216" text-anchor="middle" class="hc-m" font-size="10" fill="#8BA2AE">JSON</text>
<!-- moving packets -->
<circle cx="275" cy="160" r="5" fill="#4FBDEA" class="hc-q"/>
<circle cx="685" cy="200" r="5" fill="#8CE05E" class="hc-a"/>

<!-- snapshot jar -->
<rect x="376" y="256" width="148" height="46" rx="10" class="hc-box"/>
<text x="450" y="275" text-anchor="middle" class="hc-t" font-size="11" fill="#B0C4CF">snapshots, every 15 min</text>
<text x="450" y="292" text-anchor="middle" class="hc-m" font-size="10" fill="#8BA2AE">sqlite, "what changed?"</text>
<line x1="450" y1="232" x2="450" y2="256" stroke="#5ED2DA" stroke-width="1.5"/>
<rect x="446" y="234" width="8" height="8" rx="2" fill="#5ED2DA" class="hc-drop"/>

<text x="40" y="320" class="hc-t" font-size="11" fill="#8BA2AE">The assistant picks the tool. The server decides what is allowed. Nothing here can write.</text>
</svg>
