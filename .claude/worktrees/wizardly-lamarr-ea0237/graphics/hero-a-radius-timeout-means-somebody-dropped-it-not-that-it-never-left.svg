<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="A switch sends RADIUS from two possible source IPs. The loopback 192.0.2.1 hits NAT rule A, becomes 203.0.113.10, matches the registered client and gets an Access-Challenge back. VLAN 20 at 192.0.2.20 hits the masquerade rule, becomes 203.0.113.99, and the cloud RADIUS server silently discards it, so the switch sees a timeout." font-family="Instrument Sans,-apple-system,Helvetica,sans-serif">
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ED2DA"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8CE05E"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8BA2AE"/></marker>
  </defs>
  <text x="30" y="36" fill="#8CE05E" font-size="12" font-weight="700" letter-spacing="2">RADIUS TIMEOUTS</text>
  <text x="30" y="66" fill="#fff" font-size="20" font-weight="700">Two source IPs, two NAT rules, one registered client</text>

  <rect x="30" y="90" width="190" height="200" rx="10" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)"/>
  <text x="46" y="116" fill="#EAF2F6" font-size="14" font-weight="700">Switch (NAS)</text>
  <rect x="46" y="142" width="158" height="54" rx="6" fill="rgba(3,10,16,0.55)" stroke="#4FBDEA"/>
  <text x="58" y="164" fill="#EAF2F6" font-size="12">loopback 1</text>
  <text x="58" y="184" fill="#4FBDEA" font-size="12" font-family="JetBrains Mono,ui-monospace,Menlo,monospace">192.0.2.1</text>
  <rect x="46" y="218" width="158" height="54" rx="6" fill="rgba(3,10,16,0.55)" stroke="#8BA2AE" stroke-dasharray="4 3"/>
  <text x="58" y="240" fill="#B0C4CF" font-size="11">VLAN 20 (whatever routes)</text>
  <text x="58" y="260" fill="#8BA2AE" font-size="12" font-family="JetBrains Mono,ui-monospace,Menlo,monospace">192.0.2.20</text>

  <rect x="320" y="90" width="240" height="200" rx="10" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)"/>
  <text x="336" y="116" fill="#EAF2F6" font-size="14" font-weight="700">Firewall NAT</text>
  <rect x="336" y="142" width="208" height="54" rx="6" fill="rgba(3,10,16,0.55)" stroke="#5ED2DA"/>
  <text x="348" y="162" fill="#B0C4CF" font-size="11">rule A (pinned source)</text>
  <text x="348" y="184" fill="#5ED2DA" font-size="11.5" font-family="JetBrains Mono,ui-monospace,Menlo,monospace">192.0.2.1 → 203.0.113.10</text>
  <rect x="336" y="218" width="208" height="54" rx="6" fill="rgba(3,10,16,0.55)" stroke="#8BA2AE" stroke-dasharray="4 3"/>
  <text x="348" y="238" fill="#B0C4CF" font-size="11">rule B (masquerade)</text>
  <text x="348" y="260" fill="#8BA2AE" font-size="11.5" font-family="JetBrains Mono,ui-monospace,Menlo,monospace">192.0.2.20 → 203.0.113.99</text>

  <rect x="680" y="90" width="190" height="200" rx="10" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)"/>
  <text x="696" y="116" fill="#EAF2F6" font-size="14" font-weight="700">Cloud RADIUS</text>
  <rect x="696" y="142" width="158" height="64" rx="6" fill="rgba(3,10,16,0.55)" stroke="#8CE05E"/>
  <text x="708" y="162" fill="#B0C4CF" font-size="11">registered client</text>
  <text x="708" y="180" fill="#8CE05E" font-size="12" font-family="JetBrains Mono,ui-monospace,Menlo,monospace">203.0.113.10</text>
  <text x="708" y="198" fill="#B0C4CF" font-size="11">plus the shared secret</text>
  <text x="696" y="244" fill="#8BA2AE" font-size="11">anyone else:</text>
  <text x="696" y="264" fill="#EAF2F6" font-size="12" font-weight="700">silently discarded</text>

  <line x1="204" y1="166" x2="334" y2="166" stroke="#5ED2DA" stroke-width="2" marker-end="url(#at)"/>
  <line x1="544" y1="166" x2="694" y2="166" stroke="#5ED2DA" stroke-width="2" marker-end="url(#at)"/>
  <line x1="680" y1="207" x2="562" y2="207" stroke="#8CE05E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="620" y="201" fill="#8CE05E" font-size="10.5" text-anchor="middle">Access-Challenge</text>
  <line x1="320" y1="207" x2="222" y2="207" stroke="#8CE05E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="270" y="201" fill="#8CE05E" font-size="10.5" text-anchor="middle">reply</text>

  <line x1="204" y1="245" x2="334" y2="245" stroke="#8BA2AE" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
  <line x1="544" y1="245" x2="626" y2="245" stroke="#8BA2AE" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="632" y1="237" x2="648" y2="253" stroke="#8BA2AE" stroke-width="2.5"/>
  <line x1="648" y1="237" x2="632" y2="253" stroke="#8BA2AE" stroke-width="2.5"/>
  <text x="640" y="274" fill="#8BA2AE" font-size="11" text-anchor="middle">no reply</text>

  <text x="30" y="320" fill="#8BA2AE" font-size="13">A timeout is that X. The request left, reached the server and was dropped without a word.</text>
</svg>
