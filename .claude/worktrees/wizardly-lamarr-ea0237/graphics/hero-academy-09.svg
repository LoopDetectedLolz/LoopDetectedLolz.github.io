<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Lesson 9: Roaming, the client decides. A corridor with AP 1 on the left and AP 2 on the right. Two RSSI curves, one from each AP, cross in the middle at about -61 dBm. The client's actual roam point is marked later, where AP 1 has fallen to -70 dBm, the sticky roam. A second mark shows where 802.11k and 802.11v can pull the roam earlier. Caption: the client decides; the AP can point, ask or shove, but it can't move anyone.">
  <defs>
    <style>
      .eb { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1.5px; fill: #F5A524; }
      .hl { font-family: 'Instrument Sans', sans-serif; font-size: 22px; font-weight: 600; fill: #EAF2F6; }
      .t  { font-family: 'Instrument Sans', sans-serif; font-size: 12px; fill: #B0C4CF; }
      .ts { font-family: 'Instrument Sans', sans-serif; font-size: 11px; fill: #8BA2AE; }
      .m  { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8BA2AE; }
      .mo { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #F5A524; font-weight: 600; }
      .mg { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #8CE05E; font-weight: 600; }
      .cap { font-family: 'Instrument Sans', sans-serif; font-size: 13px; fill: #F5A524; }
      .box { fill: rgba(0,0,0,0.45); stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .grid { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .c1 { fill: none; stroke: #5ED2DA; stroke-width: 2.5; }
      .c2 { fill: none; stroke: #B0C4CF; stroke-width: 2.5; stroke-dasharray: 6 4; }
      .vo { stroke: #F5A524; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .vg { stroke: #8CE05E; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .ap { fill: rgba(0,0,0,0.5); stroke: #B0C4CF; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="24" y="36" class="eb">LESSON 9: ROAMING, THE CLIENT DECIDES</text>
  <text x="24" y="66" class="hl">The curves cross halfway. The client moves when it wants to.</text>

  <rect x="24" y="84" width="852" height="212" rx="8" class="box"/>

  <!-- APs -->
  <rect x="40" y="96" width="46" height="22" rx="4" class="ap"/>
  <text x="63" y="111" text-anchor="middle" class="t">AP 1</text>
  <rect x="814" y="96" width="46" height="22" rx="4" class="ap"/>
  <text x="837" y="111" text-anchor="middle" class="t">AP 2</text>

  <!-- axis -->
  <line x1="110" y1="153.2" x2="790" y2="153.2" class="grid"/>
  <line x1="110" y1="207.6" x2="790" y2="207.6" class="grid"/>
  <line x1="110" y1="262.0" x2="790" y2="262.0" class="grid"/>
  <text x="102" y="157.2" text-anchor="end" class="m">-50 dBm</text>
  <text x="102" y="211.6" text-anchor="end" class="m">-70</text>
  <text x="102" y="266.0" text-anchor="end" class="m">-90</text>

  <!-- curves -->
  <path d="M110.0,126.0 L120.0,127.6 L130.0,129.2 L140.0,130.8 L150.0,132.4 L160.0,134.1 L170.0,135.7 L180.0,137.3 L190.0,139.0 L200.0,140.6 L210.0,142.2 L220.0,143.9 L230.0,145.5 L240.0,147.2 L250.0,148.9 L260.0,150.5 L270.0,152.2 L280.0,153.9 L290.0,155.6 L300.0,157.2 L310.0,158.9 L320.0,160.6 L330.0,162.3 L340.0,164.0 L350.0,165.8 L360.0,167.5 L370.0,169.2 L380.0,170.9 L390.0,172.6 L400.0,174.4 L410.0,176.1 L420.0,177.9 L430.0,179.6 L440.0,181.4 L450.0,183.1 L460.0,184.9 L470.0,186.6 L480.0,188.4 L490.0,190.2 L500.0,192.0 L510.0,193.8 L520.0,195.6 L530.0,197.4 L540.0,199.2 L550.0,201.0 L560.0,202.8 L570.0,204.6 L580.0,206.4 L590.0,208.2 L600.0,210.0 L610.0,211.9 L620.0,213.7 L630.0,215.6 L640.0,217.4 L650.0,219.3 L660.0,221.1 L670.0,223.0 L680.0,224.8 L690.0,226.7 L700.0,228.6 L710.0,230.5 L720.0,232.4 L730.0,234.2 L740.0,236.1 L750.0,238.0 L760.0,239.9 L770.0,241.8 L780.0,243.8 L790.0,245.7" class="c1"/>
  <path d="M110.0,245.7 L120.0,243.8 L130.0,241.8 L140.0,239.9 L150.0,238.0 L160.0,236.1 L170.0,234.2 L180.0,232.4 L190.0,230.5 L200.0,228.6 L210.0,226.7 L220.0,224.8 L230.0,223.0 L240.0,221.1 L250.0,219.3 L260.0,217.4 L270.0,215.6 L280.0,213.7 L290.0,211.9 L300.0,210.0 L310.0,208.2 L320.0,206.4 L330.0,204.6 L340.0,202.8 L350.0,201.0 L360.0,199.2 L370.0,197.4 L380.0,195.6 L390.0,193.8 L400.0,192.0 L410.0,190.2 L420.0,188.4 L430.0,186.6 L440.0,184.9 L450.0,183.1 L460.0,181.4 L470.0,179.6 L480.0,177.9 L490.0,176.1 L500.0,174.4 L510.0,172.6 L520.0,170.9 L530.0,169.2 L540.0,167.5 L550.0,165.8 L560.0,164.0 L570.0,162.3 L580.0,160.6 L590.0,158.9 L600.0,157.2 L610.0,155.6 L620.0,153.9 L630.0,152.2 L640.0,150.5 L650.0,148.9 L660.0,147.2 L670.0,145.5 L680.0,143.9 L690.0,142.2 L700.0,140.6 L710.0,139.0 L720.0,137.3 L730.0,135.7 L740.0,134.1 L750.0,132.4 L760.0,130.8 L770.0,129.2 L780.0,127.6 L790.0,126.0" class="c2"/>
  <text x="116" y="149.0" class="ts" fill="#5ED2DA">RSSI from AP 1</text>
  <text x="784" y="149.0" text-anchor="end" class="ts">RSSI from AP 2</text>

  <!-- crossing -->
  <circle cx="450.0" cy="183.1" r="4" fill="none" stroke="#B0C4CF" stroke-width="1.5"/>
  <text x="450.0" y="138" text-anchor="middle" class="ts">curves cross, about -61 dBm</text>
  <line x1="450.0" y1="143" x2="450.0" y2="176.1" class="grid"/>

  <!-- 11k/v earlier -->
  <line x1="478.0" y1="188.1" x2="478.0" y2="270" class="vg"/>
  <circle cx="478.0" cy="188.1" r="5" fill="#8CE05E"/>
  <text x="470.0" y="264" text-anchor="end" class="mg">with 11v: nudged earlier, if the client listens</text>

  <!-- sticky roam -->
  <line x1="587" y1="207.7" x2="587" y2="270" class="vo"/>
  <circle cx="587" cy="207.7" r="5" fill="#F5A524"/>
  <text x="599" y="191.7" class="mo">actual roam, -70 dBm</text>
  <text x="599" y="205.7" class="ts">the client's own trigger, not the AP's</text>

  <!-- corridor -->
  <line x1="110" y1="284" x2="790" y2="284" class="grid"/>
  <circle cx="330.0" cy="284" r="5" fill="#F5A524"/>
  <path d="M342.0,284 L390.0,284" stroke="#F5A524" stroke-width="1.5"/>
  <path d="M384.0,280 L390.0,284 L384.0,288" fill="none" stroke="#F5A524" stroke-width="1.5"/>
  <text x="400.0" y="288" class="ts">client walking AP 1 to AP 2</text>

  <text x="24" y="320" class="cap">The client decides. The AP can point (11k), ask (11v) or shove (deauth). It can't move anyone.</text>
</svg>
