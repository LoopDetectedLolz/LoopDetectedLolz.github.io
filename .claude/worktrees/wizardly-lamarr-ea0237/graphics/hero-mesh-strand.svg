<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Three states of an over the air mesh conversion: a working mesh, conversion wiping everything but the uplink parameters, and mesh points with no cluster configuration and no wire to receive one">
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .mono{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .big{font-size:20px;font-weight:700}
    .eyebrow{font-size:11px;letter-spacing:2px;font-weight:600}
    .cap{font-size:10.5px;letter-spacing:2px}
    .lb{font-size:12px;font-weight:600}
    .note{font-size:12px}
  </style>
  <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8CE05E"/></marker>
  </defs>

  <text x="30" y="34" class="t mono eyebrow" fill="#8CE05E">CONVERSION IS A PROVISIONING EVENT</text>
  <text x="30" y="64" class="t big" fill="#ffffff">A mesh point cannot be provisioned over the mesh you just erased.</text>

  <g>
    <text x="30" y="100" class="t mono cap" fill="#8BA2AE">BEFORE</text>
    <rect x="30" y="112" width="256" height="150" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="50" y="132" width="90" height="30" rx="7" fill="#8CE05E"/>
    <text x="95" y="152" class="t lb" fill="#06202A" text-anchor="middle">Portal</text>
    <path d="M50 147 L34 147" stroke="#5ED2DA" stroke-width="2.5"/>
    <text x="150" y="152" class="t note" fill="#5ED2DA">wired</text>
    <rect x="60" y="196" width="80" height="28" rx="7" fill="#5ED2DA"/>
    <text x="100" y="215" class="t lb" fill="#06202A" text-anchor="middle">Point</text>
    <rect x="170" y="196" width="80" height="28" rx="7" fill="#5ED2DA"/>
    <text x="210" y="215" class="t lb" fill="#06202A" text-anchor="middle">Point</text>
    <path d="M95 162 L100 196 M95 162 L206 196" stroke="#8CE05E" stroke-width="1.6" stroke-dasharray="3 3"/>
    <text x="50" y="248" class="t note" fill="#B0C4CF">cluster profile on every one</text>
  </g>

  <g>
    <text x="322" y="100" class="t mono cap" fill="#8BA2AE">DURING: ap convert</text>
    <rect x="322" y="112" width="256" height="150" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="342" y="140" class="t note" fill="#B0C4CF">The AP boots AOS 10, finds Central,</text>
    <text x="342" y="160" class="t note" fill="#B0C4CF">and Central cleans up the old config.</text>
    <rect x="342" y="176" width="216" height="34" rx="8" fill="#8CE05E" fill-opacity="0.16" stroke="#8CE05E" stroke-opacity="0.5"/>
    <text x="450" y="197" class="t lb" fill="#B6F08F" text-anchor="middle">Uplink parameters: kept</text>
    <rect x="342" y="216" width="216" height="34" rx="8" fill="none" stroke="#8BA2AE" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="450" y="237" class="t lb" fill="#8BA2AE" text-anchor="middle">Mesh cluster profile: gone</text>
  </g>

  <g>
    <text x="614" y="100" class="t mono cap" fill="#8BA2AE">AFTER</text>
    <rect x="614" y="112" width="256" height="150" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="634" y="132" width="90" height="30" rx="7" fill="#8CE05E"/>
    <text x="679" y="152" class="t lb" fill="#06202A" text-anchor="middle">Portal</text>
    <path d="M634 147 L618 147" stroke="#5ED2DA" stroke-width="2.5"/>
    <rect x="644" y="196" width="80" height="28" rx="7" fill="none" stroke="#8BA2AE" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="684" y="215" class="t lb" fill="#8BA2AE" text-anchor="middle">Point</text>
    <rect x="754" y="196" width="80" height="28" rx="7" fill="none" stroke="#8BA2AE" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="794" y="215" class="t lb" fill="#8BA2AE" text-anchor="middle">Point</text>
    <text x="634" y="248" class="t note" fill="#8BA2AE">no cluster profile, no wire, no way back</text>
  </g>

  <path d="M290 187 L318 187" stroke="#8CE05E" stroke-width="1.8" fill="none" marker-end="url(#m1)"/>
  <path d="M582 187 L610 187" stroke="#8CE05E" stroke-width="1.8" fill="none" marker-end="url(#m1)"/>
  <text x="30" y="322" class="t note" fill="#B0C4CF">Central requires a mesh to be provisioned over the wire the first time. That first time is now.</text>
</svg>
