<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="The RSN element of a WPA2 SSID before and after WPA2/WPA3 transition mode is enabled: SAE joins PSK in the AKM list, a group management cipher applies and the MFPC bit is set. A four-cell table shows the legal outcomes of the AP's and client's management frame protection bits, plus a fifth outcome where an old driver never parses the element and sends no association request at all." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><style>
    .t{font-family:Instrument Sans,-apple-system,Helvetica,sans-serif}
    .mono{font-family:JetBrains Mono,ui-monospace,Menlo,monospace}
    .big{font-size:20px;font-weight:700}
    .eyebrow{font-size:11px;letter-spacing:2px;font-weight:600}
    .lane{font-size:10.5px;letter-spacing:2px}
    .f{font-size:11.5px}
    .fb{font-size:11.5px;font-weight:700}
    .cell{font-size:11.5px;font-weight:600}
    .note{font-size:12px}
  </style>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8CE05E"/></marker>
  </defs>

  <text x="30" y="34" class="t mono eyebrow" fill="#8CE05E">SAME NAME, SAME PASSPHRASE, DIFFERENT ELEMENT</text>
  <text x="30" y="64" class="t big" fill="#ffffff">Transition mode rewrites the RSN element. Old drivers have to read it first.</text>

  <!-- before -->
  <text x="30" y="96" class="t mono lane" fill="#8BA2AE">RSN ELEMENT, WPA2-PSK</text>
  <rect x="30" y="104" width="190" height="126" rx="10" fill="rgba(3,10,16,0.55)" stroke="rgba(255,255,255,0.12)"/>
  <g class="t mono f" fill="#B0C4CF">
    <text x="44" y="128">pairwise   CCMP</text>
    <text x="44" y="150">AKM        PSK</text>
    <text x="44" y="172">grp mgmt   n/a</text>
    <text x="44" y="202">MFPC 0   MFPR 0</text>
  </g>
  <line x1="44" y1="184" x2="206" y2="184" stroke="#ffffff" stroke-opacity="0.12"/>

  <path d="M226 167 L262 167" stroke="#8CE05E" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>

  <!-- after -->
  <text x="270" y="96" class="t mono lane" fill="#8BA2AE">WPA2/WPA3 TRANSITION</text>
  <rect x="270" y="104" width="226" height="126" rx="10" fill="rgba(3,10,16,0.55)" stroke="#4FBDEA" stroke-opacity="0.7"/>
  <g class="t mono f" fill="#B0C4CF">
    <text x="284" y="128">pairwise   CCMP</text>
    <text x="284" y="150">AKM        PSK <tspan fill="#4FBDEA" font-weight="700">+ SAE</tspan></text>
    <text x="284" y="172">grp mgmt   <tspan fill="#4FBDEA" font-weight="700">BIP-CMAC-128</tspan><tspan fill="#8BA2AE"> (default)</tspan></text>
    <text x="284" y="202"><tspan fill="#4FBDEA" font-weight="700">MFPC 1</tspan>   MFPR 0</text>
  </g>
  <line x1="284" y1="184" x2="482" y2="184" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="30" y="254" class="t note" fill="#B0C4CF">A longer AKM list and one new bit. The passphrase never changed.</text>

  <!-- truth table -->
  <text x="530" y="96" class="t mono lane" fill="#8BA2AE">WHAT THE TWO BITS ALLOW</text>
  <text x="640" y="118" class="t f" fill="#8BA2AE" text-anchor="middle">client capable</text>
  <text x="783" y="118" class="t f" fill="#8BA2AE" text-anchor="middle">client not capable</text>
  <text x="575" y="151" class="t f" fill="#8BA2AE" text-anchor="end">AP optional</text>
  <text x="575" y="201" class="t f" fill="#8BA2AE" text-anchor="end">AP required</text>

  <g class="t cell" text-anchor="middle">
    <rect x="582" y="128" width="116" height="40" rx="8" fill="#8CE05E"/>
    <text x="640" y="153" fill="#06202A">PMF on</text>
    <rect x="716" y="128" width="134" height="40" rx="8" fill="#5ED2DA"/>
    <text x="783" y="153" fill="#06202A">joins, no PMF</text>
    <rect x="582" y="178" width="116" height="40" rx="8" fill="#8CE05E"/>
    <text x="640" y="203" fill="#06202A">PMF on</text>
    <rect x="716" y="178" width="134" height="40" rx="8" fill="rgba(3,10,16,0.55)" stroke="#8BA2AE" stroke-dasharray="5 4"/>
    <text x="783" y="203" fill="#B0C4CF">rejected, status 31</text>
  </g>

  <!-- fifth outcome -->
  <rect x="520" y="236" width="350" height="44" rx="9" fill="#F5A524" fill-opacity="0.10" stroke="#F5A524" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="695" y="254" class="t fb" fill="#FFC168" text-anchor="middle">The fifth outcome, not in any table</text>
  <text x="695" y="271" class="t f" fill="#FFC168" text-anchor="middle">driver gives up on the element, never associates, no log</text>

  <text x="30" y="320" class="t note" fill="#8BA2AE">Optional never rejects a WPA2 client. The old printer module rejects itself, from its side, and your AP has no association to log.</text>
</svg>
