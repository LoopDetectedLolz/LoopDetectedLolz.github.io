<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Before and after: with the portals on different channels the point sat on the marginal link and its monitor table never listed the other portal; with both portals on one channel it heard both and reselected the strong one">
  <defs>
    <style>
      .t{font:600 14px "Instrument Sans",-apple-system,Helvetica,sans-serif;fill:#EAF2F6}
      .lb{font:500 12px "Instrument Sans",-apple-system,Helvetica,sans-serif;fill:#B0C4CF}
      .sm{font:400 11px "Instrument Sans",-apple-system,Helvetica,sans-serif;fill:#8BA2AE}
      .mo{font:500 11px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#8BA2AE}
      .box{fill:rgba(3,10,16,0.55);stroke:rgba(255,255,255,0.12)}
      .ap{fill:rgba(3,10,16,0.55);stroke:#5ED2DA;stroke-width:1.5}
      .apdim{fill:rgba(3,10,16,0.35);stroke:rgba(255,255,255,0.18);stroke-width:1.5;stroke-dasharray:4 3}
    </style>
  </defs>

  <!-- before -->
  <rect x="30" y="20" width="410" height="250" rx="14" class="box"/>
  <text x="50" y="48" class="t">Before: portals on two channels</text>
  <rect x="60" y="80" width="130" height="44" rx="10" class="ap"/>
  <text x="125" y="98" class="lb" text-anchor="middle">735 portal</text>
  <text x="125" y="115" class="mo" text-anchor="middle">channel 120</text>
  <rect x="270" y="80" width="130" height="44" rx="10" class="apdim"/>
  <text x="335" y="98" class="lb" text-anchor="middle" style="fill:#8BA2AE">505H portal</text>
  <text x="335" y="115" class="mo" text-anchor="middle">channel 149</text>
  <rect x="165" y="196" width="140" height="44" rx="10" class="ap"/>
  <text x="235" y="214" class="lb" text-anchor="middle">635 point</text>
  <text x="235" y="231" class="mo" text-anchor="middle">on 120 with the 735</text>
  <line x1="150" y1="124" x2="215" y2="196" stroke="#5ED2DA" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="128" y="170" class="sm" text-anchor="end">SNR 9, 72 Mb/s</text>
  <text x="335" y="165" class="sm" text-anchor="middle">not in its monitor table</text>
  <text x="50" y="250" class="sm">Its monitor table had no entry for the 505H.</text>
  <text x="50" y="264" class="sm">Not losing, not in the race.</text>

  <!-- arrow -->
  <line x1="448" y1="145" x2="482" y2="145" stroke="#8CE05E" stroke-width="2"/>
  <polygon points="482,139 494,145 482,151" fill="#8CE05E"/>

  <!-- after -->
  <rect x="500" y="20" width="370" height="250" rx="14" class="box"/>
  <text x="520" y="48" class="t">After: the 735 pinned to 149E</text>
  <rect x="530" y="80" width="130" height="44" rx="10" class="ap"/>
  <text x="595" y="98" class="lb" text-anchor="middle">735 portal</text>
  <text x="595" y="115" class="mo" text-anchor="middle">channel 149</text>
  <rect x="710" y="80" width="130" height="44" rx="10" class="ap"/>
  <text x="775" y="98" class="lb" text-anchor="middle">505H portal</text>
  <text x="775" y="115" class="mo" text-anchor="middle">channel 149</text>
  <rect x="615" y="196" width="140" height="44" rx="10" class="ap"/>
  <text x="685" y="214" class="lb" text-anchor="middle">635 point</text>
  <text x="685" y="231" class="mo" text-anchor="middle">hears both</text>
  <line x1="620" y1="124" x2="665" y2="196" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="750" y1="124" x2="705" y2="196" stroke="#8CE05E" stroke-width="3"/>
  <text x="606" y="168" class="sm" text-anchor="end">neighbour, SNR 8</text>
  <text x="742" y="168" class="sm">SNR 30, 720 Mb/s</text>
  <text x="520" y="250" class="sm">Reselected in three and a half minutes.</text>
  <text x="520" y="264" class="sm">On one channel the second portal is a candidate at every reselection.</text>
</svg>
