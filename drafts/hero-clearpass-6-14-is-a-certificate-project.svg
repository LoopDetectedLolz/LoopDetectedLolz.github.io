<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="The ClearPass 6.14 upgrade gate. On the left, what stops the upgrade: SHA-1 certificates or CRLs, Gen9 C2000 and C3000 hardware, BIOS boot, a hostname with an underscore, and 6.9 or 6.10 sources that need a restore onto 6.11 first. On the right, what upgrades fine and breaks after: AP EAP-TLS and RadSec on SHA-1 device certificates, Active Directory child domains, macOS OnGuard agent auto-upgrade, Access Tracker history, custom CoA attributes and service parameters, and RADIUS certificates with short keys.">
<text x="24" y="36" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#8CE05E">CLEARPASS 6.11 / 6.12 TO 6.14 · THE UPGRADE GATE</text>
<text x="24" y="66" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#fff">Some of it stops the upgrade. Some of it waits for Monday.</text>
<rect x="20" y="88" width="376" height="214" rx="12" fill="rgba(3,10,16,0.55)" stroke="rgba(240,112,95,0.45)"/>
<rect x="504" y="88" width="376" height="214" rx="12" fill="rgba(3,10,16,0.55)" stroke="rgba(245,165,36,0.45)"/>
<text x="38" y="114" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#F0705F">STOPS THE UPGRADE</text>
<text x="522" y="114" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#F5A524">UPGRADES FINE, BREAKS AFTER</text>
<g font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="13.5" fill="#EAF2F6">
<circle cx="44" cy="146" r="3.5" fill="#F0705F"/><text x="56" y="151">SHA-1 certs or CRLs (imported, enabled, in use)</text>
<circle cx="44" cy="177" r="3.5" fill="#F0705F"/><text x="56" y="182">Gen9 C2000 / C3000 hardware</text>
<circle cx="44" cy="208" r="3.5" fill="#F0705F"/><text x="56" y="213">BIOS boot (6.14 is UEFI only)</text>
<circle cx="44" cy="239" r="3.5" fill="#F0705F"/><text x="56" y="244">Hostname with an underscore</text>
<circle cx="44" cy="270" r="3.5" fill="#F0705F"/><text x="56" y="275">6.9 / 6.10 (restore onto 6.11 first)</text>
<circle cx="528" cy="141" r="3.5" fill="#F5A524"/><text x="540" y="146">AP EAP-TLS, RadSec on SHA-1 device certs</text>
<circle cx="528" cy="167" r="3.5" fill="#F5A524"/><text x="540" y="172">AD child domains (KB5066014, rejoin)</text>
<circle cx="528" cy="193" r="3.5" fill="#F5A524"/><text x="540" y="198">macOS OnGuard agent auto-upgrade</text>
<circle cx="528" cy="219" r="3.5" fill="#F5A524"/><text x="540" y="224">Access Tracker history (restore logs)</text>
<circle cx="528" cy="245" r="3.5" fill="#F5A524"/><text x="540" y="250">Custom CoA attributes, service params</text>
<circle cx="528" cy="271" r="3.5" fill="#F5A524"/><text x="540" y="276">RADIUS cert under RSA 2048 / EC 224</text>
</g>
<line x1="450" y1="92" x2="450" y2="298" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="414" y="168" width="72" height="54" rx="10" fill="#0E2A3C" stroke="#5ED2DA"/>
<text x="450" y="191" text-anchor="middle" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5ED2DA">UPGRADE</text>
<text x="450" y="207" text-anchor="middle" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5ED2DA">GATE</text>
<path d="M396 195 L404 195 M406 186 L406 204" stroke="#F0705F" stroke-width="2.5" fill="none"/>
<path d="M490 195 L500 195 M500 195 L494 189 M500 195 L494 201" stroke="#F5A524" stroke-width="2" fill="none"/>
<text x="24" y="326" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" fill="#8BA2AE">My stock 6.11.1 lab box: 46 trust list certs, 25 signed SHA-1, 3 of those enabled. Patch to 6.14.1 in the same window.</text>
</svg>
