<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Schematic of the walk route, not a floor plan. The AP-735 and the desk are together. From the desk the route goes to the laundry room 41 feet from the AP, then the hall 35 feet, the living room by the stairs 22 feet, the entry 22 feet, the dining room 23 feet, and back to the desk, with 20 seconds at each stop. Rings mark 10, 20, 30 and 40 feet from the AP.">
