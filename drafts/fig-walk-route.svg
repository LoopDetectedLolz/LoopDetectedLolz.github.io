<text x="454.0" y="157.2" text-anchor="start" font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="11" font-weight="400" fill="#8BA2AE">30 ft</text>
<circle cx="330" cy="368" r="320.0" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="3 5"/>
<text x="494.0" y="87.9" text-anchor="start" font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="11" font-weight="400" fill="#8BA2AE">40 ft</text>
</g>
