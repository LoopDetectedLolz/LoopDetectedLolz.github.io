<text x="606.0" y="44.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#8CE05E">THE ROUTE</text>
<circle cx="615" cy="72" r="9" fill="#5ED2DA"/><text x="615.0" y="76.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#06202A">S</text>
<text x="632.0" y="76.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#B0C4CF">Desk, 4 ft from the AP. Start here</text>
<circle cx="615" cy="102" r="9" fill="#5ED2DA"/><text x="615.0" y="106.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#06202A">5</text>
<text x="632.0" y="106.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#EAF2F6">Laundry room, 41 ft</text>
<circle cx="615" cy="132" r="9" fill="#5ED2DA"/><text x="615.0" y="136.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#06202A">4</text>
<text x="632.0" y="136.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#EAF2F6">Hall to the laundry, 35 ft</text>
<circle cx="615" cy="162" r="9" fill="#5ED2DA"/><text x="615.0" y="166.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#06202A">3</text>
<text x="632.0" y="166.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#EAF2F6">Living room by the stairs, 22 ft</text>
<circle cx="615" cy="192" r="9" fill="#5ED2DA"/><text x="615.0" y="196.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#06202A">2</text>
<text x="632.0" y="196.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#EAF2F6">Entry, 22 ft</text>
<circle cx="615" cy="222" r="9" fill="#5ED2DA"/><text x="615.0" y="226.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#06202A">1</text>
<text x="632.0" y="226.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#EAF2F6">Dining room, 23 ft</text>
<circle cx="615" cy="252" r="9" fill="#5ED2DA"/><text x="615.0" y="256.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#06202A">S</text>
<text x="632.0" y="256.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#B0C4CF">Back to the desk</text>
<text x="606.0" y="294.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#8BA2AE">20 seconds at each stop, about 1.5 ft</text>
<text x="606.0" y="312.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#8BA2AE">a second between them. Five minutes of</text>
<text x="606.0" y="330.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#8BA2AE">iperf3 download, SSID pinned to this</text>
<text x="606.0" y="348.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#8BA2AE">one AP so the phone had nowhere else</text>
<text x="606.0" y="366.0" text-anchor="start" font-family="Instrument Sans,-apple-system,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#8BA2AE">to go.</text>
</svg>
