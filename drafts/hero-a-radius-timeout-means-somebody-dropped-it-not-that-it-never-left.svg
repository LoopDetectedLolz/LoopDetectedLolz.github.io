<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Inter,Segoe UI,system-ui,sans-serif">
  <rect x="0" y="0" width="900" height="340" fill="#0B0F14"/>
  <text x="30" y="36" fill="#8FDB69" font-size="12" font-weight="700" letter-spacing="2">RADIUS TIMEOUT, TRACED</text>
  <text x="30" y="66" fill="#fff" font-size="20" font-weight="700">Two source addresses, one registered client, one silent drop</text>

  <rect x="30" y="90" width="200" height="200" rx="10" fill="#141C26" stroke="#243040"/>
  <text x="130" y="114" fill="#8A99AB" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">SWITCH (NAS)</text>
  <rect x="45" y="130" width="170" height="50" rx="6" fill="#0B0F14" stroke="#8FDB69"/>
  <text x="130" y="151" fill="#fff" font-size="13" text-anchor="middle">loopback 1</text>
  <text x="130" y="170" fill="#8FDB69" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">192.0.2.10</text>
  <rect x="45" y="210" width="170" height="50" rx="6" fill="#0B0F14" stroke="#E0B34E"/>
  <text x="130" y="231" fill="#fff" font-size="13" text-anchor="middle">VLAN 20 address</text>
  <text x="130" y="250" fill="#E0B34E" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">192.0.2.130</text>

  <rect x="330" y="90" width="230" height="200" rx="10" fill="#141C26" stroke="#243040"/>
  <text x="445" y="114" fill="#8A99AB" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">FIREWALL NAT</text>
  <rect x="345" y="130" width="200" height="50" rx="6" fill="#0B0F14" stroke="#243040"/>
  <text x="445" y="151" fill="#fff" font-size="12" text-anchor="middle">rule A</text>
  <text x="445" y="170" fill="#8FDB69" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">192.0.2.10 to 203.0.113.10</text>
  <rect x="345" y="210" width="200" height="50" rx="6" fill="#0B0F14" stroke="#243040"/>
  <text x="445" y="231" fill="#fff" font-size="12" text-anchor="middle">rule B</text>
  <text x="445" y="250" fill="#E0B34E" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">192.0.2.130 to 203.0.113.99</text>

  <rect x="670" y="90" width="200" height="200" rx="10" fill="#141C26" stroke="#243040"/>
  <text x="770" y="114" fill="#8A99AB" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CLOUD RADIUS</text>
  <rect x="685" y="130" width="170" height="50" rx="6" fill="#0B0F14" stroke="#7EE08A"/>
  <text x="770" y="151" fill="#fff" font-size="12" text-anchor="middle">registered client</text>
  <text x="770" y="170" fill="#7EE08A" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">203.0.113.10</text>
  <rect x="685" y="210" width="170" height="50" rx="6" fill="#0B0F14" stroke="#F0705F" stroke-dasharray="4 3"/>
  <text x="770" y="231" fill="#fff" font-size="12" text-anchor="middle">unknown client</text>
  <text x="770" y="250" fill="#F0705F" font-size="11" text-anchor="middle">silently discarded</text>

  <line x1="215" y1="150" x2="339" y2="150" stroke="#8FDB69" stroke-width="2"/>
  <polygon points="345,150 337,146 337,154" fill="#8FDB69"/>
  <line x1="545" y1="150" x2="679" y2="150" stroke="#8FDB69" stroke-width="2"/>
  <polygon points="685,150 677,146 677,154" fill="#8FDB69"/>
  <line x1="685" y1="170" x2="551" y2="170" stroke="#7AB8E8" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="545,170 553,166 553,174" fill="#7AB8E8"/>
  <text x="615" y="192" fill="#7AB8E8" font-size="11" text-anchor="middle">reply</text>

  <line x1="215" y1="235" x2="339" y2="235" stroke="#E0B34E" stroke-width="2"/>
  <polygon points="345,235 337,231 337,239" fill="#E0B34E"/>
  <line x1="545" y1="235" x2="640" y2="235" stroke="#F0705F" stroke-width="2"/>
  <line x1="642" y1="225" x2="662" y2="245" stroke="#F0705F" stroke-width="3"/>
  <line x1="662" y1="225" x2="642" y2="245" stroke="#F0705F" stroke-width="3"/>
  <text x="600" y="262" fill="#F0705F" font-size="11" text-anchor="middle">no reply</text>

  <text x="30" y="326" fill="#8A99AB" font-size="12">A RADIUS timeout is that X. The request left; the server chose not to answer.</text>
</svg>
