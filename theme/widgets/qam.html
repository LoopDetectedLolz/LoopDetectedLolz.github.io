<section class="qam g-card" id="qam" data-rise aria-label="Live modulation demo: a real 118-byte Wi-Fi frame from a packet capture sent over the air from a Yagi antenna to a QAM constellation">
  <div class="qam-top">
    <span class="eyebrow">On the air right now</span>
    <div class="qam-ctl" role="group" aria-label="Demo controls">
      <label>MCS <select id="qam-mcs"></select></label>
      <label>Streams <select id="qam-ss"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <label>Width <select id="qam-bw"><option>20</option><option>40</option><option selected>80</option><option>160</option><option>320</option></select></label>
      <label class="qam-speed">Speed <input id="qam-speed" type="range" min="-2" max="3" step="0.25" value="0"><b id="qam-speed-v">1x</b></label>
      <button class="chip" id="qam-pause" type="button" aria-pressed="false">Pause</button>
      <button class="chip" id="qam-mp" type="button" aria-pressed="false">Multipath</button>
      <button class="chip" id="qam-follow" type="button">Follow a symbol</button>
      <button class="chip" id="qam-fs" type="button" aria-pressed="false">Fullscreen</button>
      <button class="chip" id="qam-table-t" type="button" aria-pressed="false">Compare rates</button>
    </div>
  </div>
  <canvas id="qam-c" width="1200" height="280" role="img" aria-label="Animated beam of particles from a Yagi antenna landing on a constellation diagram"></canvas>
  <div class="qam-rx" id="qam-rx">
    <div class="qam-rx-top">
      <span class="eyebrow">Received bytes</span>
      <span class="qam-key" aria-hidden="true"><i class="f-mac">802.11</i><i class="f-llc">LLC/SNAP</i><i class="f-ip">IPv4</i><i class="f-icmp">ICMP</i><i class="f-pay">payload</i><i class="f-fcs">FCS</i><i class="f-bad">corrupted</i></span>
      <a href="demo/nfn-ping.pcap" download="nfn-ping.pcap">Download the capture</a>
    </div>
    <div class="qam-hex" id="qam-hex" aria-live="off"></div>
    <div class="qam-fld" id="qam-fld"></div>
    <div class="qam-ascii"><span class="eyebrow">Payload</span><span class="qam-title" id="qam-rxt"></span></div>
  </div>
  <div class="qam-stat" id="qam-stat"></div>
  <div class="qam-hint" id="qam-hint">Hover or touch the beam to add interference. Tap the text to see what's happening</div>
  <div class="qam-table" id="qam-table" hidden></div>
  <div class="qam-x" id="qam-x" hidden></div>
</section>
<script>
(function(){
  var root=document.getElementById('qam'); if(!root)return;

  var MCS=[["BPSK",1,1/2,"1/2"],["QPSK",2,1/2,"1/2"],["QPSK",2,3/4,"3/4"],["16-QAM",4,1/2,"1/2"],["16-QAM",4,3/4,"3/4"],["64-QAM",6,2/3,"2/3"],["64-QAM",6,3/4,"3/4"],["64-QAM",6,5/6,"5/6"],["256-QAM",8,3/4,"3/4"],["256-QAM",8,5/6,"5/6"],["1024-QAM",10,3/4,"3/4"],["1024-QAM",10,5/6,"5/6"],["4096-QAM",12,3/4,"3/4"],["4096-QAM",12,5/6,"5/6"]];

  var k,sx,sy,bits=[],syms=[],next=0,fly=[],landed=[],errors=0,attempt=1,phase='tx',pt=0,emitT=0;
  var retries=0,frames=0,frameUs=0,cleanUs=0,okRun=0,failRun=0,cw=CWMIN,adaptNote='',fcs=null;
  var cur={x:0,y:0,on:false}, specks=[], tsec=0, lastNow=0, IR=48;
  var X,hint;var Q={sp:2.2,max:260,sk:150,blur:2,gh:0.02}, tier=3, drop=0, ema=16, govT=0, drawMs=0;

  var mp=false, echoes=[], lastFade=null, ladderPos=7, rateShown=0, flash=null, rxBits=[];
  var ghosts=[], pre=[], preSent=0, preT=0, synced=false, gridRot=0, cfo=0, lockT=0, followReq=false, followed=null, followHold=0, speedSaved=null, TURNS=5;
  /* quality: slower deserves more detail, faster less; a governor sheds detail when frames run long */

  function quality(){var base=speed<=0.5?3:speed<=1?2:speed<=2?1:0;var t=Math.max(0,base-drop);if(t!==tier){tier=t;Q=TIERS[t];}}

  }
  /* the receiver's copy: bits in the order they landed, bytes rebuilt LSB first, FCS checked with a real CRC-32 */
  function rxStream(){var s='';for(var si=0;si<syms.length;si++){if(rxBits[si]===undefined)break;s+=rxBits[si];}return s}

  function startPre(){phase='pre';pre=[];preSent=0;preT=0;synced=false;cfo=(Math.random()<0.5?-1:1)*(4+Math.random()*6);gridRot=cfo*2.2*Math.PI/180;lockT=0;}

  var fs=false;
  function resize(){var r=c.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=Math.max(320,Math.round(r.width));H=fs?Math.max(240,Math.min(620,Math.round(window.innerHeight*0.56))):(W<600?260:280);IR=W<600?36:48;c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
  function layout(){var mob=W<600,R=mob?Math.min(W*0.20,64):Math.min(H*0.36,100);var ax=mob?52:Math.round(W*0.11),ay=Math.round(H*0.5);var cx=W-R-(mob?36:56),cy=ay;return{mob:mob,R:R,ax:ax,ay:ay,ex:ax+(mob?26:46),cx:cx,cy:cy,cell:(2*R)/Math.max(sx,sy)};}
  function wall(L){var x0=L.ex+(L.cx-L.R-L.ex)*0.30,x1=L.ex+(L.cx-L.R-L.ex)*0.72;return{x0:x0,x1:x1,y:L.ay+L.R*(L.mob?0.95:0.82)};}
  function echoAt(L,e,s){var Wl=wall(L);var bx=Wl.x0+(Wl.x1-Wl.x0)*e.bf,by=Wl.y;var d1=Math.hypot(bx-L.ex,by-L.ay),d2=Math.hypot(e.T.x-bx,e.T.y-by),d=d1+d2,u=s*d;

    ctx.fillStyle='rgba(245,165,36,0.95)';ctx.beginPath();for(i=0;i<landed.length;i++){var d3=landed[i];if(d3.bad){ctx.moveTo(d3.x+2.6,d3.y);ctx.arc(d3.x,d3.y,2.6,0,Math.PI*2);}}ctx.fill();

      ctx.fillStyle='#9fe6ea';ctx.beginPath();for(i=0;i<echoes.length;i++){var hp2=echoes[i].trail[echoes[i].trail.length-1];if(hp2){ctx.moveTo(hp2.x+1.8,hp2.y);ctx.arc(hp2.x,hp2.y,1.8,0,Math.PI*2);}}ctx.fill();}
    /* symbols in flight, with tails */
    function drawTrail(tr,cut,col,hit,w){ /* cut: fraction of the trail (from the source) already faded; one stroke per half-turn */
      ctx.lineCap='round';var n=tr.length,c0=Math.floor(cut*n),start=Math.max(1,c0-6);if(n-start<2)return;
      var j=start;while(j<n){var sgn=(tr[j].depth||0)>=0,j0=j,cnt=0;while(j<n&&(((tr[j].depth||0)>=0)===sgn)&&cnt<40){j++;cnt++;}

  function table(){var rows='';for(var m=0;m<MCS.length;m++){var r=rate(m,ss,bw),bp=bitsPerOFDM(m,ss,bw),n=Math.ceil(bits.length/bp),f=Math.ceil(12000/bp);
      rows+='<tr data-m="'+m+'"'+(m===mcsSel?' class="on"':'')+'><td>'+m+'</td><td>'+MCS[m][0]+'</td><td>'+MCS[m][3]+'</td><td>'+bp+'</td><td>'+r.toFixed(1)+'</td><td>'+n+' ('+(PRE+n*TSYM).toFixed(0)+' µs)</td><td>'+f+' ('+(PRE+f*TSYM).toFixed(0)+' µs)</td></tr>';}
    var T=document.getElementById('qam-table');
    T.innerHTML='<span class="eyebrow">MCS index, '+ss+' stream'+(ss>1?'s':'')+', '+bw+' MHz, 0.8 µs guard interval, 40 µs preamble</span><div class="tbl"><table><tr><th>MCS</th><th>Modulation</th><th>Coding</th><th>Bits per OFDM symbol</th><th>PHY rate Mb/s</th><th>This frame ('+FRAME.length+' B)</th><th>A 1500-byte frame</th></tr>'+rows+'</table></div>'+
      '<p class="meta">Tap a row to send at that modulation. Then hold the cursor in the beam: the higher the row, the smaller the decision cell on the constellation, the fewer particles it takes to corrupt the frame, and the sooner rate adaptation walks you back down the table.</p>';
    T.querySelectorAll('tr[data-m]').forEach(function(tr){tr.addEventListener('click',function(e){e.stopPropagation();setSel(+tr.getAttribute('data-m'));})});
  }
  function setSel(m){mcsSel=m;mcsCur=m;document.getElementById('qam-mcs').value=m;adaptNote='';newFrame();if(!document.getElementById('qam-table').hidden)table();}
  var selM=document.getElementById('qam-mcs');MCS.forEach(function(r,i){var o=document.createElement('option');o.value=i;o.textContent=i+'  '+r[0]+' '+r[3];selM.appendChild(o)});selM.value=7;
  selM.addEventListener('change',function(){setSel(+selM.value)});
  document.getElementById('qam-ss').addEventListener('change',function(e){ss=+e.target.value;newFrame();if(!document.getElementById('qam-table').hidden)table();});
  document.getElementById('qam-bw').addEventListener('change',function(e){bw=+e.target.value;newFrame();if(!document.getElementById('qam-table').hidden)table();});
  var sp=document.getElementById('qam-speed'),spv=document.getElementById('qam-speed-v');sp.addEventListener('input',function(){speed=Math.pow(2,+sp.value);spv.textContent=(speed<1?speed.toFixed(2).replace(/0+$/,''):speed)+'x'});
  var pb=document.getElementById('qam-pause');pb.addEventListener('click',function(e){e.stopPropagation();paused=!paused;pb.textContent=paused?'Play':'Pause';pb.setAttribute('aria-pressed',paused)});
  var tb=document.getElementById('qam-table-t'),TB=document.getElementById('qam-table');tb.addEventListener('click',function(e){e.stopPropagation();TB.hidden=!TB.hidden;if(!TB.hidden)table();tb.setAttribute('aria-pressed',!TB.hidden);tb.textContent=TB.hidden?'Compare rates':'Hide rates'});
  var fsb=document.getElementById('qam-fs');
  function setFs(on){fs=on;root.classList.toggle('fs',on);document.documentElement.classList.toggle('qam-fs',on);fsb.textContent=on?'Exit fullscreen':'Fullscreen';fsb.setAttribute('aria-pressed',on);resize();seedSpecks(layout());landed=[];ghosts=[];hintText();}
  fsb.addEventListener('click',function(e){e.stopPropagation();setFs(!fs);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&fs)setFs(false);});
  var touchy=window.matchMedia('(hover: none)').matches;
  function hintText(){if(!hint)return;hint.textContent=touchy&&!fs?'On a phone, tap Fullscreen to touch the beam without scrolling the page. Tap this text to see what’s happening':(touchy?'Drag a finger through the beam to add interference. Tap this text to see what’s happening':'Hover or touch the beam to add interference. Tap the text to see what’s happening');}
  var fb2=document.getElementById('qam-follow');fb2.addEventListener('click',function(e){e.stopPropagation();followReq=true;if(followed&&followed.s<1)return;});
  var mpb=document.getElementById('qam-mp');mpb.addEventListener('click',function(e){e.stopPropagation();mp=!mp;lastFade=null;echoes=[];mpb.setAttribute('aria-pressed',mp);mpb.classList.toggle('on',mp);});
  root.querySelector('.qam-ctl').addEventListener('click',function(e){e.stopPropagation()});TB.addEventListener('click',function(e){e.stopPropagation()});
  /* hex panel: hover or tap a byte to see its field */
  var RXP=document.getElementById('qam-rx');RXP.addEventListener('click',function(e){e.stopPropagation()});
  function hovB(e){var t=e.target;var b=t&&t.getAttribute?t.getAttribute('data-b'):null;var h=b===null||b===undefined?-1:fieldOf(+b);if(h!==hover){hover=h;stat();}}
  HX.addEventListener('pointerover',hovB);HX.addEventListener('pointerdown',hovB);HX.addEventListener('pointerleave',function(){if(hover>=0){hover=-1;stat();}});
  /* interference: pointer over the canvas */
  function setCur(e){var r=c.getBoundingClientRect();cur.x=e.clientX-r.left;cur.y=e.clientY-r.top;cur.on=true;}
  c.addEventListener('pointermove',setCur);c.addEventListener('pointerdown',setCur);c.addEventListener('pointerleave',function(){cur.on=false});c.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')cur.on=false});c.addEventListener('pointercancel',function(){cur.on=false});
  c.addEventListener('click',function(e){e.stopPropagation()});
  /* explainer */
  X=document.getElementById('qam-x');hint=document.getElementById('qam-hint');hintText();
  function explain(){var b0=FRAME[0],bin=b0.toString(2).padStart(8,'0'),lsb=bin.split('').reverse().join('');
    var mac=0,parts=[];for(var i=0;i<FIELDS.length;i++){if(FCLS[i]==='f-mac')mac+=FIELDS[i][1];else parts.push(FIELDS[i][1]+' of '+esc(FIELDS[i][2]));}
    var anatomy=(mac?mac+' bytes of 802.11 header, ':'')+parts.join(', ');
    X.innerHTML='<span class="eyebrow">What you are looking at</span>'+
      '<p>A Yagi on the left is aimed at the receiver on the right, and it is sending a real frame: a ping from a client to its access point, '+FRAME.length+' bytes, lifted from a packet capture you can download above and open in Wireshark. Every particle carries bits from that capture, in order, and the hex panel fills in as they land. The pale shape is the antenna’s main lobe: the directors in front of the driven element squeeze the energy forward, which is why the specks ride a beam instead of spraying everywhere. The little bulge behind the mast is the back lobe you can never quite get rid of.</p>'+
      '<ol><li>Bytes become bits. The first byte is Frame Control, <code>0x'+('0'+b0.toString(16)).slice(-2)+'</code>, which is <code>'+bin+'</code>; the radio sends each byte least-significant bit first, so it leaves the antenna as <code>'+lsb+'</code>. The whole frame is '+bits.length+' bits: '+anatomy+'.</li>'+
      '<li>Bits are chopped into groups of '+k+' ('+MCS[mcsCur][0]+'), Gray coded, and each group picks one point on the '+sx+'×'+sy+' constellation: I is the column, Q is the row. Amplitude is how far from the centre, phase is the angle.</li>'+
      '<li>Each bright particle is one of those symbols. It flies down the beam and peels off to its row as it arrives. Where it lands is what the receiver sees: never exactly on the point, because noise moved it. Green dots decoded correctly; an orange dot crossed into the wrong cell and decoded as the wrong bits. The hex panel is the receiver’s copy of the frame, byte by byte, coloured by what each byte is for. Hover a byte to see which field it belongs to and what it says.</li>'+
      '<li>Put your cursor or finger in the beam. That is interference: a microwave, a neighbour’s AP, a badly shielded PoE run. Particles passing through it get pushed and land in the wrong cell, and the receiver still gets a frame, just a wrong one. The last four bytes are the FCS, a CRC-32 the sender computed over the other '+(FCSF?FCSF[0]:FRAME.length-4)+'. The receiver computes its own over what it received and compares, and that comparison, not the picture, is what decides whether an ACK goes back. One flipped bit anywhere and the two differ, so no ACK comes, the sender waits DIFS plus a random backoff, and the whole frame goes again. Every retry doubles the backoff window. Watch the time-on-the-air figure climb against the clean number.</li>'+
      '<li>After two failed attempts the sender drops one MCS step, the constellation gets coarser, the cells get bigger, and it takes more interference to corrupt a symbol. That is rate adaptation, and it is why a client near a microwave shows a low PHY rate rather than no connection. Three clean frames and it climbs back.</li>'+
      '<li>Turn on Multipath and a reflector appears under the beam. Every symbol now arrives twice: the direct copy and a dimmer teal echo that bounced off the wall and travelled further. At the receiver the two add as waves. When the extra distance is a whole number of wavelengths they arrive in phase and the signal is stronger than the direct path alone (upfade); half a wavelength off and they cancel (downfade). The receiver equalises the amplitude back using the pilots, so what you see is the noise: a downfade spreads the landing dots and corrupts symbols, an upfade tightens them. The dB readout above the grid is the fade on the last symbol. With Streams set to 2 the receiver has two antennas a little apart, so they see different phases and the combined signal stops swinging; that spatial diversity is the simplest thing MIMO buys you, and the same multipath that ruins one antenna is what lets two streams be told apart at all.</li>'+
      '<li>Every attempt starts with a short train of white pulses before any data: the preamble. Those are the L-STF and L-LTF, fixed patterns both ends know. The receiver uses them to find where the symbols start (timing), to measure how far its own oscillator is off from the sender’s (carrier frequency offset, a few parts per million, which is the constellation visibly spinning until it locks), and to learn the channel so it can equalise. Nothing decodes until LOCKED shows. Without that lock, the phasor in the lens would keep rotating against the receiver’s reference and every symbol would land in the wrong cell.</li>'+
      '<li>Each particle corkscrews down the beam because a symbol is a phasor: a vector with an amplitude and a phase riding the carrier. The radius of the corkscrew is the amplitude, its starting angle is the phase, and the two together are what land on the constellation. Follow a symbol and the lens magnifies one of them with its phasor drawn alongside, slows the scene, names the byte and field it belongs to, and reports what the receiver decided when it lands.</li>'+
      '<li>The ladder at the top is the MCS index, live. The bright step is the rate in use, the outlined step is the one you picked, and the marker slides when rate adaptation moves it. The Mb/s figure next to it is the PHY rate that goes with the step.</li>'+
      '<li>One particle here is one subcarrier. A real '+bw+' MHz channel sends '+NSD[bw]+' of them at once per stream every 13.6 µs, plus a 40 µs preamble, which is where the rate table comes from.</li></ol>'+
      '<p class="meta">What is left out: a real radio scrambles the bits, adds forward error correction (the coding rate in the table), interleaves them across subcarriers, and sends a PHY header before any of this. Those are skipped so the bits on the screen stay the bits in the capture. The capture holds two frames, this one and the 14-byte ACK the AP answers with. Timings are the 5 GHz OFDM values: 9 µs slot, 16 µs SIFS, 34 µs DIFS, contention window 15 doubling to 1023, 7 retries before the frame is dropped. Nothing here is encrypted; WPA3 would scramble everything after the 802.11 header and the picture would look identical.</p>';}
  function toggleX(){var open=X.hidden;if(open)explain();X.hidden=!open;if(open)hint.textContent='Tap the text again to close';else hintText();}
  root.addEventListener('click',toggleX);root.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleX()}});root.tabIndex=0;
  window.addEventListener('resize',function(){resize();seedSpecks(layout())});
  resize();buildBits();buildHex();newFrame();frames=1;seedSpecks(layout());stat();
  if(reduce){var L0=layout();while(next<syms.length){emit(L0);var f0=fly.pop();f0.s=1;land(L0,f0);}fcs=checkFcs();phase='ack';paused=true;pb.textContent='Play';draw(0);stat();pb.addEventListener('click',function(){if(!paused){lastNow=0;requestAnimationFrame(step)}});}
  else requestAnimationFrame(step);
})();
</script>
