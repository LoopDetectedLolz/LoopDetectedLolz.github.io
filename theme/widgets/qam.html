<section class="qam g-card" id="qam" data-rise aria-label="Live modulation demo: the latest post title sent over the air as QAM symbols">
  <div class="qam-top">
    <span class="eyebrow">On the air right now</span>
    <div class="qam-ctl" role="group" aria-label="Demo controls">
      <label>Order <select id="qam-order"><option value="16">16-QAM</option><option value="64" selected>64-QAM</option><option value="256">256-QAM</option></select></label>
      <label class="qam-speed">Speed <input id="qam-speed" type="range" min="-2" max="3" step="0.25" value="0"><b id="qam-speed-v">1x</b></label>
      <button class="chip" id="qam-pause" type="button" aria-pressed="false">Pause</button>
    </div>
  </div>
  <canvas id="qam-c" width="1200" height="240" role="img" aria-label="Animated constellation diagram"></canvas>
  <div class="qam-hint" id="qam-hint">Tap the banner to see what's happening</div>
  <div class="qam-x" id="qam-x" hidden></div>
</section>
<script>
(function(){
  var root=document.getElementById('qam'); if(!root)return;
  var c=document.getElementById('qam-c'),ctx=c.getContext('2d');
  var title=root.getAttribute('data-title')||'Network Field Notes';
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var order=64,k=6,side=8,speed=1,paused=false,W=1200,H=240,dpr=1;
  var bits=[],pos=0,sym=null,t=0,recv=[],decoded='',charBits='',cloud=[];
  var G=['#8CE05E','#5ED2DA','#4FBDEA'],MUT='#8BA2AE',DIM='#B0C4CF';
  function gray(n){return n^(n>>1)}
  function utf8(s){return unescape(encodeURIComponent(s))}
  function reset(){
    bits=[]; var b=utf8(title); for(var i=0;i<b.length;i++){var v=b.charCodeAt(i);for(var j=7;j>=0;j--)bits.push((v>>j)&1)}
    while(bits.length%k)bits.push(0);
    pos=0;sym=null;t=0;recv=[];decoded='';charBits='';cloud=[];
  }
  function setOrder(m){order=m;k=Math.round(Math.log(m)/Math.LN2);side=Math.sqrt(m);reset()}
  function resize(){
    var r=c.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(320,Math.round(r.width)); H=W<600?340:220; c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function layout(){
    var mob=W<600;
    var R=mob?Math.min(W*0.28,92):Math.min(H*0.40,88);
    return {mob:mob,R:R,cx:mob?W*0.5:W*0.42,cy:mob?R+30:H*0.52,tx:mob?30:W*0.07,ty:mob?44:H*0.52,rx:mob?W*0.5:W*0.62,ry:mob?2*R+86:H*0.30,R:R};
  }
  function symbolOf(p){ /* bits at p -> (ix,iy) gray-coded */
    var h=k/2,a=0,b=0; for(var i=0;i<h;i++)a=(a<<1)|bits[p+i]; for(i=0;i<h;i++)b=(b<<1)|bits[p+h+i];
    return {ix:gray(a),iy:gray(b),a:a,b:b};
  }
  function pt(L,ix,iy){var s=(2*L.R)/side; return {x:L.cx-L.R+s*(ix+0.5),y:L.cy+L.R-s*(iy+0.5),s:s}}
  function easeOut(x){return 1-Math.pow(1-x,3)}
  function draw(now){
    var L=layout(); ctx.clearRect(0,0,W,H);
    // grid target
    ctx.save(); ctx.translate(L.cx,L.cy);
    ctx.strokeStyle='rgba(94,210,218,0.25)'; ctx.lineWidth=1;
    for(var r=L.R;r>0;r-=L.R/4){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke()}
    ctx.strokeStyle='rgba(255,255,255,0.10)'; var s=(2*L.R)/side;
    for(var i=0;i<=side;i++){ctx.beginPath();ctx.moveTo(-L.R+i*s,-L.R);ctx.lineTo(-L.R+i*s,L.R);ctx.stroke();ctx.beginPath();ctx.moveTo(-L.R,-L.R+i*s);ctx.lineTo(L.R,-L.R+i*s);ctx.stroke()}
    ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.beginPath();ctx.moveTo(-L.R-8,0);ctx.lineTo(L.R+8,0);ctx.moveTo(0,-L.R-8);ctx.lineTo(0,L.R+8);ctx.stroke();
    ctx.fillStyle=MUT; ctx.font='10px JetBrains Mono,ui-monospace,monospace'; ctx.fillText('I',L.R+12,4); ctx.fillText('Q',-3,-L.R-12);
    ctx.fillStyle='rgba(234,242,246,0.55)';
    for(var x=0;x<side;x++)for(var y=0;y<side;y++){ctx.beginPath();ctx.arc(-L.R+s*(x+0.5),L.R-s*(y+0.5),side>8?1.1:1.8,0,Math.PI*2);ctx.fill()}
    ctx.restore();
    // received cloud
    for(i=0;i<cloud.length;i++){var d=cloud[i];ctx.fillStyle=d.bad?'rgba(245,165,36,0.9)':'rgba(140,224,94,'+(0.25+0.6*d.a)+')';ctx.beginPath();ctx.arc(d.x,d.y,d.bad?2.4:1.9,0,Math.PI*2);ctx.fill()}
    // sender
    ctx.save(); ctx.translate(L.tx,L.ty); ctx.strokeStyle=G[0]; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(0,-6);ctx.stroke(); ctx.fillStyle=G[0];ctx.beginPath();ctx.arc(0,-8,3,0,Math.PI*2);ctx.fill();
    for(i=1;i<=3;i++){ctx.globalAlpha=0.55-i*0.13;ctx.beginPath();ctx.arc(0,-8,6*i+((now/240)%6),-0.9,0.9);ctx.stroke()} ctx.globalAlpha=1;
    ctx.fillStyle=MUT; ctx.font='10px JetBrains Mono,ui-monospace,monospace'; ctx.textAlign='center'; ctx.fillText('AP',0,26); ctx.restore();
    // receiver text
    ctx.save(); ctx.textAlign=L.mob?'center':'left'; var rx=L.rx, ry=L.ry;
    ctx.fillStyle=MUT; ctx.font='10px JetBrains Mono,ui-monospace,monospace'; ctx.fillText('RECEIVED  ('+order+'-QAM, '+k+' bits per symbol)',rx,ry-16);
    ctx.fillStyle='#EAF2F6'; ctx.font='600 15px Instrument Sans,-apple-system,Helvetica,sans-serif';
    var maxW=L.mob?W-40:W-rx-24, shown=decoded, m=ctx.measureText(shown).width;
    while(m>maxW&&shown.length>1){shown='…'+shown.slice(2);m=ctx.measureText(shown).width}
    ctx.fillText(shown+(paused?'':'█'),rx,ry+6);
    ctx.fillStyle=G[1]; ctx.font='11px JetBrains Mono,ui-monospace,monospace'; ctx.fillText((charBits||'').replace(/(.{4})/g,'$1 ')+'   '+(sym?('I='+sym.ix+' Q='+sym.iy):''),rx,ry+28);
    ctx.fillStyle=MUT; ctx.font='10px Instrument Sans,-apple-system,Helvetica,sans-serif'; ctx.fillText(L.mob?'latest post title, in cleartext':'the title of the latest post, in cleartext, one symbol at a time',rx,ry+46);
    ctx.restore();
    // particle
    if(sym){
      var P=pt(L,sym.ix,sym.iy), ang=Math.atan2(P.y-L.cy,P.x-L.cx), rad=Math.hypot(P.x-L.cx,P.y-L.cy);
      var x,y;
      if(t<0.3){var u=easeOut(t/0.3); var ex=L.cx+Math.cos(ang+Math.PI*3)* (L.R+16), ey=L.cy+Math.sin(ang+Math.PI*3)*(L.R+16);
        x=L.tx+(ex-L.tx)*u; y=(L.ty-8)+(ey-(L.ty-8))*u - Math.sin(u*Math.PI)*40;}
      else{var v=(t-0.3)/0.7, e=easeOut(v); var rr=(L.R+16)+(rad-(L.R+16))*e, th=ang+Math.PI*3*(1-v); x=L.cx+Math.cos(th)*rr; y=L.cy+Math.sin(th)*rr;}
      ctx.fillStyle=G[0]; ctx.shadowColor=G[0]; ctx.shadowBlur=12; ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(140,224,94,0.35)'; ctx.beginPath();ctx.arc(P.x,P.y,P.s*0.45,0,Math.PI*2);ctx.stroke();
    }
  }
  var last=0;
  function step(now){
    if(!last)last=now; var dt=Math.min(50,now-last); last=now;
    if(!paused&&!document.hidden){
      if(!sym){ if(pos>=bits.length){ if(t>1.6){reset()} else t+=dt/1000; } else { sym=symbolOf(pos); t=0; } }
      else { t+=dt/1000*speed*0.9; if(t>=1){ land(); } }
    }
    draw(now); requestAnimationFrame(step);
  }
  function land(){
    var L=layout(),P=pt(L,sym.ix,sym.iy); var n=P.s*0.34; var jx=(Math.random()+Math.random()-1)*n, jy=(Math.random()+Math.random()-1)*n;
    var bad=Math.abs(jx)>P.s/2||Math.abs(jy)>P.s/2; cloud.push({x:P.x+jx,y:P.y+jy,a:Math.random(),bad:bad}); if(cloud.length>400)cloud.shift();
    var chunk=bits.slice(pos,pos+k).join(''); charBits+=chunk; pos+=k;
    while(charBits.length>=8){ var code=parseInt(charBits.slice(0,8),2); charBits=charBits.slice(8); decoded+=String.fromCharCode(code); }
    try{ decoded=decodeURIComponent(escape(decoded)); }catch(e){}
    sym=null; t=0;
  }
  // controls
  document.getElementById('qam-order').addEventListener('change',function(e){setOrder(+e.target.value)});
  var sp=document.getElementById('qam-speed'),spv=document.getElementById('qam-speed-v');
  sp.addEventListener('input',function(){speed=Math.pow(2,+sp.value);spv.textContent=(speed<1?speed.toFixed(2).replace(/0+$/,''):speed)+'x'});
  var pb=document.getElementById('qam-pause'); pb.addEventListener('click',function(e){e.stopPropagation();paused=!paused;pb.textContent=paused?'Play':'Pause';pb.setAttribute('aria-pressed',paused)});
  root.querySelector('.qam-ctl').addEventListener('click',function(e){e.stopPropagation()});
  // explainer
  var X=document.getElementById('qam-x'),hint=document.getElementById('qam-hint');
  function explain(){
    var b=utf8(title), ch=title.charAt(0), code=b.charCodeAt(0), bin=code.toString(2).padStart(8,'0');
    var first=[]; for(var i=0;i<8;i++)first.push((code>>(7-i))&1);
    var h=k/2,a=0,q=0; for(i=0;i<h;i++)a=(a<<1)|(first[i]||0); for(i=0;i<h;i++)q=(q<<1)|(first[h+i]||0);
    X.innerHTML='<span class="eyebrow">What you are looking at</span>'+
      '<p>The title of the latest post is <b>'+title.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</b>. That is '+b.length+' bytes, '+bits.length+' bits, '+Math.ceil(b.length*8/k)+' symbols at '+order+'-QAM. This banner sends it the way a Wi-Fi radio would, minus the encryption.</p>'+
      '<ol><li>Text becomes bytes. <code>'+ch+'</code> is <code>0x'+code.toString(16)+'</code>, which is <code>'+bin+'</code>.</li>'+
      '<li>Bits get chopped into groups of '+k+'. The first group is <code>'+first.slice(0,k).join('')+'</code>: '+(k/2)+' bits pick the I axis (in phase) and '+(k/2)+' pick the Q axis (quadrature), Gray coded so neighbouring points differ by one bit.</li>'+
      '<li>That lands on one point of the '+side+'x'+side+' grid: I='+gray(a)+', Q='+gray(q)+'. Amplitude is how far from the centre, phase is the angle. One point, one symbol, '+k+' bits.</li>'+
      '<li>The particle is that symbol in flight. The dot it leaves behind is what the receiver actually sees: never exactly on the point, because noise moved it. Orange dots crossed into the wrong decision region and would decode as the wrong bits.</li>'+
      '<li>Switch to 256-QAM and watch the grid get denser while the noise stays the same size. That is the whole reason the fast rates need a clean signal, and why your AP drops to a lower QAM order when the client walks away.</li></ol>'+
      '<p class="meta">Nothing here is encrypted. This is what "sent in cleartext" looks like at the physical layer. WPA3 would scramble the bits before they ever reached the grid, and the constellation would look identical.</p>';
  }
  root.addEventListener('click',function(){ var open=X.hidden; if(open){explain()} X.hidden=!open; hint.textContent=open?'Tap again to close':'Tap the banner to see what’s happening'; });
  root.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();root.click()}}); root.tabIndex=0;
  // go
  window.addEventListener('resize',resize); resize(); setOrder(64);
  if(reduce){ /* static: full decode, no motion */ while(pos<bits.length){sym=symbolOf(pos);land()} paused=true; pb.textContent='Play'; draw(0); pb.addEventListener('click',function(){if(!paused){last=0;requestAnimationFrame(step)}}); }
  else requestAnimationFrame(step);
})();
</script>
