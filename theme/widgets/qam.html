      <label>Width <select id="qam-bw"></select></label>

  /* explainer */

  function explain(){var b0=FRAME[0],bin=b0.toString(2).padStart(8,'0'),lsb=bin.split('').reverse().join('');
    var mac=0,parts=[];for(var i=0;i<FIELDS.length;i++){if(FCLS[i]==='f-mac')mac+=FIELDS[i][1];else parts.push(FIELDS[i][1]+' of '+esc(FIELDS[i][2]));}
    var anatomy=(mac?mac+' bytes of 802.11 header, ':'')+parts.join(', ');
    var nph=PTX_W*S.tsym*1e-6/(6.626e-34*S.f*1e9),cyc=Math.round(S.tsym*1e-6*S.f*1e9),ns=nSym(mcsCur,ss,bw);
    X.innerHTML='<span class="eyebrow">What you are looking at</span>'+
      '<p>A Yagi on the left is aimed at the receiver on the right, and it is sending a real frame: a ping from a client to its access point, '+FRAME.length+' bytes, lifted from a packet capture you can download above and open in Wireshark. Every particle carries bits from that capture, in order, and the hex panel fills in as they land. The pale shape is the antenna’s main lobe: the directors in front of the driven element squeeze the energy forward, which is why the specks ride a beam instead of spraying everywhere. The little bulge behind the mast is the back lobe you can never quite get rid of.</p>'+
      '<ol><li>Bytes become bits. The first byte is Frame Control, <code>0x'+('0'+b0.toString(16)).slice(-2)+'</code>, which is <code>'+bin+'</code>; the radio sends each byte least-significant bit first, so it leaves the antenna as <code>'+lsb+'</code>. The whole frame is '+bits.length+' bits: '+anatomy+'.</li>'+
      '<li>Bits are chopped into groups of '+k+' ('+MCS[mcsCur][0]+'), Gray coded, and each group picks one point on the '+sx+'×'+sy+' constellation: I is the column, Q is the row. Amplitude is how far from the centre, phase is the angle.</li>'+
      '<li>Each bright particle is one of those symbols. It flies down the beam and peels off to its row as it arrives. Where it lands is what the receiver sees: never exactly on the point, because noise moved it. Green dots decoded correctly; an orange dot crossed into the wrong cell and decoded as the wrong bits. The hex panel is the receiver’s copy of the frame, byte by byte, coloured by what each byte is for. Hover a byte to see which field it belongs to and what it says.</li>'+
      '<li>Put your cursor or finger in the beam. That is interference: a microwave, a neighbour’s AP, a badly shielded PoE run. Particles passing through it get pushed and land in the wrong cell, and the receiver still gets a frame, just a wrong one. The last four bytes are the FCS, a CRC-32 the sender computed over the other '+(FCSF?FCSF[0]:FRAME.length-4)+'. The receiver computes its own over what it received and compares, and that comparison, not the picture, is what decides whether an ACK goes back. One flipped bit anywhere and the two differ, so no ACK comes, the sender waits DIFS plus a random backoff, and the whole frame goes again. Every retry doubles the backoff window. Watch the time-on-the-air figure climb against the clean number.</li>'+
      '<li>After two failed attempts the sender drops one MCS step, the constellation gets coarser, the cells get bigger, and it takes more interference to corrupt a symbol. That is rate adaptation, and it is why a client near a microwave shows a low PHY rate rather than no connection. Three clean frames and it climbs back.</li>'+
      '<li>Turn on Multipath and a reflector appears under the beam. Every symbol now arrives twice: the direct copy and a dimmer teal echo that bounced off the wall and travelled further. At the receiver the two add as waves. When the extra distance is a whole number of wavelengths they arrive in phase and the signal is stronger than the direct path alone (upfade); half a wavelength off and they cancel (downfade). The receiver equalises the amplitude back using the pilots, so what you see is the noise: a downfade spreads the landing dots and corrupts symbols, an upfade tightens them. The dB readout above the grid is the fade on the last symbol. With Streams set to 2 the receiver has two antennas a little apart, so they see different phases and the combined signal stops swinging; that spatial diversity is the simplest thing MIMO buys you, and the same multipath that ruins one antenna is what lets two streams be told apart at all.</li>'+
      '<li>Every attempt starts with a short train of white pulses before any data: the preamble. Those are the L-STF and L-LTF, fixed patterns both ends know. The receiver uses them to find where the symbols start (timing), to measure how far its own oscillator is off from the sender’s (carrier frequency offset, a few parts per million, which is the constellation visibly spinning until it locks), and to learn the channel so it can equalise. Nothing decodes until LOCKED shows. Without that lock, the phasor in the lens would keep rotating against the receiver’s reference and every symbol would land in the wrong cell.</li>'+
      '<li>Each particle corkscrews down the beam because a symbol is a phasor: a vector with an amplitude and a phase riding the carrier. The radius of the corkscrew is the amplitude and its angle is the phase. It rides the antenna’s lobe, so the orbit widens as the beam spreads, and the last turn is the circle the symbol lands on: the constellation is that corkscrew seen end-on, frozen at the instant the receiver samples it. Follow a symbol and the lens magnifies one of them with its phasor drawn alongside, slows the scene, names the byte and field it belongs to, and reports what the receiver decided when it lands.</li>'+
      '<li>The ladder at the top is the MCS index, live. The bright step is the rate in use, the outlined step is the one you picked, and the marker slides when rate adaptation moves it. The Mb/s figure next to it is the PHY rate that goes with the step.</li>'+
      '<li>One particle here is one subcarrier. A real '+bw+' MHz '+S.name+' channel sends '+S.nsd[bw]+' of them at once per stream every '+S.tsym+' µs, after a '+S.pre(ss).toFixed(1)+' µs preamble, which is where the rate table comes from. This frame fits in '+ns+' OFDM symbol'+(ns>1?'s':'')+'.</li>'+
      '<li><b>Time.</b> The slider is a slow-motion factor, and the picture changes with it because nothing looks the same at every scale. <i>Frames</i>: at real time this frame is a '+airtime(mcsCur,ss,bw).toFixed(0)+' µs flash and the channel does thousands of them a second, so all you can see is the medium; the strip at the bottom is the DCF cycle to scale: preamble, data, SIFS, ACK, DIFS, backoff, and every retry pushes the next frame further right. <i>Symbols</i>: about a hundred thousand times slower, one particle per symbol, the view described above. <i>Waves</i>: a billion times slower, the carrier itself. A '+S.f.toFixed(1)+' GHz cycle is '+(1e3/S.f).toFixed(0)+' ps and a wavelength is '+(30/S.f).toFixed(1)+' cm, so what leaves the antenna is a field shaped by the Yagi’s pattern, main lobe, side lobes and back lobe, and one symbol is '+cyc.toLocaleString()+' of those cycles at a single amplitude and phase. With Multipath on, the wall shows the reflection as a mirror image of the antenna, and the fringes where the two copies meet are the fades from the multipath item above. Move the cursor into the scene and it becomes a second radio on a nearby channel; the beat pattern is what interference means to an RF engineer. <i>Photons</i>: slower still. A 20 dBm radio at '+S.f.toFixed(1)+' GHz emits about '+fmtBig(nph)+' photons per symbol, each with the same energy, '+fmtBig(6.626e-34*S.f*1e9)+' J, leaving in directions drawn from the pattern. Only about '+Math.round(rxFrac*100)+'% of the pattern points at the receiver here, and in the real room free-space loss over '+BENCH_M+' m at '+S.f.toFixed(1)+' GHz is 56 dB, so it catches one photon in about 400,000. That is why a symbol is a smooth phasor and never looks grainy: the receiver averages an astronomical number of them.</li>'+
      '<li><b>Standard.</b> The menu changes the physics under the same frame. 802.11a/g: 48 data subcarriers in 20 MHz, a 4 µs symbol, one stream, eight rates topping out at 54 Mb/s. 802.11n: 40 MHz, 64-QAM 5/6, four streams. 802.11ac: 80 and 160 MHz, 256-QAM, eight streams. 802.11ax: the symbol stretches to 12.8 µs plus guard, which packs four times the subcarriers into the same width, plus 1024-QAM. 802.11be: 320 MHz and 4096-QAM. Open Compare rates after switching: this ping takes '+stdAir('a')+' on 802.11a and '+stdAir('be')+' on 802.11be. The new standards win on bytes per second, not on the latency of a ping, because on a frame this small the preamble is most of the airtime.</li></ol>'+
      '<p class="meta">What is left out: a real radio scrambles the bits, adds forward error correction (the coding rate in the table), interleaves them across subcarriers, and sends a PHY header before any of this. Those are skipped so the bits on the screen stay the bits in the capture. The capture holds two frames, this one and the 14-byte ACK the AP answers with. Timings are the 5 GHz OFDM values: 9 µs slot, 16 µs SIFS, 34 µs DIFS, contention window 15 doubling to 1023, 7 retries before the frame is dropped; preamble lengths are the single-user values with one LTF per stream. The Yagi pattern is a textbook shape, not a measured one. Nothing here is encrypted; WPA3 would scramble everything after the 802.11 header and the picture would look identical.</p>';}
