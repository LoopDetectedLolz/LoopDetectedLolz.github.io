<section class="fb" id="fitband" data-rise>
  <style>
  .fb{--fb-line:rgba(255,255,255,0.12)}
  .fb-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .fb-head h3{font-size:19px;letter-spacing:-0.02em}
  .fb-lv{font:11px var(--mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--orange)}
  .fb-score{margin-left:auto;font:12px var(--mono);color:var(--text-muted)}
  .fb-goal{margin:0 0 14px;font-size:14px;line-height:1.6;color:var(--text-dim)}
  .fb-board{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .fb-bands{min-width:560px;display:flex;flex-direction:column;gap:10px}
  .fb-band{display:flex;align-items:center;gap:10px}
  .fb-name{flex:0 0 58px;font:10px var(--mono);letter-spacing:0.08em;color:var(--text-muted);text-align:right}
  .fb-strip{position:relative;flex:1;height:52px;border:1px solid var(--fb-line);border-radius:10px;background:rgba(3,10,16,0.75);overflow:hidden}
  .fb-dfs{position:absolute;top:0;bottom:0;background:rgba(245,165,36,0.10);border-left:1px dashed rgba(245,165,36,0.35);border-right:1px dashed rgba(245,165,36,0.35)}
  .fb-tick{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,0.06)}
  .fb-tick b{position:absolute;top:3px;left:3px;font:9px var(--mono);color:rgba(255,255,255,0.28);font-weight:400}
  .fb-slot{position:absolute;z-index:3;top:6px;bottom:6px;border:1px dashed rgba(94,210,218,0.7);border-radius:7px;background:rgba(94,210,218,0.12);cursor:pointer}
  .fb-slot:hover{background:rgba(94,210,218,0.26)}
  .fb-ap{position:absolute;z-index:2;top:8px;bottom:8px;border-radius:7px;background:var(--green);color:#06202A;
    font:600 10.5px var(--mono);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  .fb-ap.fb-clash{background:var(--orange)}
  .fb-ap.fb-hit{background:rgba(245,165,36,0.2);color:var(--orange);border:1px dashed var(--orange)}
  .fb-queue{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
  .fb-chip{min-height:40px;padding:0 13px;border-radius:10px;border:1px solid var(--fb-line);
    background:rgba(255,255,255,0.05);color:var(--text);font:600 12.5px var(--mono);cursor:pointer}
  .fb-chip.on{border-color:var(--teal);background:rgba(94,210,218,0.18);color:var(--teal)}
  .fb-chip.done{opacity:0.35;cursor:default}
  .fb-say{min-height:42px;font-size:13.5px;line-height:1.6;color:var(--text-dim);margin:4px 0 12px}
  .fb-say b{color:var(--orange)}
  .fb-say i{color:var(--green);font-style:normal}
  .fb-acts{display:flex;gap:9px;flex-wrap:wrap}
  .fb-btn{min-height:42px;padding:0 15px;border-radius:11px;border:1px solid var(--fb-line);
    background:rgba(255,255,255,0.06);color:var(--text);font:600 13px var(--sans);cursor:pointer}
  .fb-btn:disabled{opacity:0.35;cursor:default}
  .fb-btn.go{border-color:rgba(140,224,94,0.55);background:rgba(140,224,94,0.14);color:#bdf29c}
  .fb-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font:10.5px var(--mono);color:var(--text-muted)}
  .fb-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  @media (max-width:560px){.fb-name{flex-basis:44px;font-size:9px}}
  </style>

  <div class="fb-head">
    <span class="fb-lv" id="fb-lv">Level 1</span>
    <h3 id="fb-title">Fit the Band</h3>
    <span class="fb-score" id="fb-score">0 points</span>
  </div>
  <p class="fb-goal" id="fb-goal"></p>

  <div class="fb-board"><div class="fb-bands" id="fb-bands"></div></div>

  <div class="fb-queue" id="fb-queue"></div>
  <p class="fb-say" id="fb-say"></p>
  <div class="fb-acts">
    <button class="fb-btn" id="fb-reset" type="button">Reset level</button>
    <button class="fb-btn go" id="fb-next" type="button" disabled>Next level</button>
  </div>
  <div class="fb-legend">
    <span><i style="background:var(--green)"></i>placed, clear</span>
    <span><i style="background:var(--orange)"></i>overlapping another AP</span>
    <span><i style="background:rgba(245,165,36,0.25);border:1px dashed rgba(245,165,36,0.6)"></i>DFS, radar can take it</span>
  </div>

  <script>
  (function () {
    var root = document.getElementById("fitband");
    if (!root) return;

    // Centre frequencies in MHz. US channels. A 20 MHz channel at centre c occupies c-10 to c+10.
    function ch5(n) { return 5000 + 5 * n; }
    function ch6(n) { return 5950 + 5 * n; }
    var BANDS = {
      b24: { name: "2.4 GHz", lo: 2400, hi: 2484, ticks: [[2412, "1"], [2437, "6"], [2462, "11"]],
             centres: { 20: [2412, 2417, 2422, 2427, 2432, 2437, 2442, 2447, 2452, 2457, 2462],
                        40: [2422, 2437, 2452] }, dfs: [] },
      b5:  { name: "5 GHz", lo: 5150, hi: 5835,
             ticks: [[ch5(36), "36"], [ch5(52), "52"], [ch5(100), "100"], [ch5(149), "149"]],
             centres: { 20: [36,40,44,48,52,56,60,64,100,104,108,112,116,120,124,128,132,136,140,144,149,153,157,161,165].map(ch5),
                        40: [38,46,54,62,102,110,118,126,134,142,151,159].map(ch5),
                        80: [42,58,106,122,138,155].map(ch5),
                        160: [50,114].map(ch5) },
             dfs: [[ch5(52) - 10, ch5(144) + 10]] },
      b6:  { name: "6 GHz", lo: 5925, hi: 7125,
             ticks: [[ch6(1), "1"], [ch6(93), "93"], [ch6(165), "165"], [ch6(229), "229"]],
             centres: (function () {
               var c = { 20: [], 40: [], 80: [], 160: [] }, n;
               for (n = 1; n <= 233; n += 4) c[20].push(ch6(n));
               for (n = 3; n <= 227; n += 8) c[40].push(ch6(n));
               for (n = 7; n <= 215; n += 16) c[80].push(ch6(n));
               for (n = 15; n <= 207; n += 32) c[160].push(ch6(n));
               return c;
             })(), dfs: [] }
    };

    var LEVELS = [
      { title: "Four rooms, four APs", bands: ["b5"], allowDfs: false, radar: false,
        queue: [20, 20, 20, 20],
        goal: "Four access points, 20 MHz each, 5 GHz only and no DFS. Drop each one on a clear channel.",
        open: "Start here. Pick an access point, then pick a channel." },
      { title: "The customer read a brochure", bands: ["b5"], allowDfs: false, radar: false,
        queue: [80, 80, 80, 80], nowin: true,
        goal: "Same four rooms, but somebody promised 80 MHz. Still 5 GHz, still no DFS.",
        open: "There are exactly two non-DFS 80 MHz channels in 5 GHz. You have four access points. Place them and see what happens." },
      { title: "DFS gets you the room back", bands: ["b5"], allowDfs: true, radar: true,
        queue: [80, 80, 80, 80],
        goal: "Same four at 80 MHz, but DFS channels are now in play. The shaded stretch is radar territory.",
        open: "Six 80 MHz channels now instead of two. The catch arrives once you use them." },
      { title: "Six gigahertz opens up", bands: ["b24", "b5", "b6"], allowDfs: true, radar: true,
        queue: [160, 160, 80, 80, 20],
        goal: "All three bands. Two APs want 160 MHz, two want 80, and one is a 2.4 GHz legacy scanner.",
        open: "160 MHz has nowhere clear to sit in 5 GHz. It has seven homes in 6 GHz." }
    ];

    var CAP = { 20: 1, 40: 2, 80: 4, 160: 8 };
    var lv = 0, placed = [], sel = null, radarFired = false;

    var elBands = document.getElementById("fb-bands"), elQueue = document.getElementById("fb-queue"),
        elSay = document.getElementById("fb-say"), elScore = document.getElementById("fb-score"),
        elGoal = document.getElementById("fb-goal"), elTitle = document.getElementById("fb-title"),
        elLv = document.getElementById("fb-lv"), elNext = document.getElementById("fb-next"),
        elReset = document.getElementById("fb-reset");

    function L() { return LEVELS[lv]; }
    function span(c, w) { return [c - w / 2, c + w / 2]; }
    function overlaps(a, b) { return a[0] < b[1] && b[0] < a[1]; }
    function inDfs(band, c, w) {
      var s = span(c, w);
      return (BANDS[band].dfs || []).some(function (d) { return overlaps(s, d); });
    }
    function clashes(i) {
      var a = placed[i];
      return placed.some(function (b, j) { return j !== i && overlaps(span(a.c, a.w), span(b.c, b.w)); });
    }
    function legal(band, w) {
      var list = (BANDS[band].centres[w] || []);
      if (!L().allowDfs) list = list.filter(function (c) { return !inDfs(band, c, w); });
      return list;
    }

    function say(html) { elSay.innerHTML = html; }

    function score() {
      var pts = 0, bad = 0;
      placed.forEach(function (p, i) {
        if (p.dead) return;
        pts += CAP[p.w];
        if (clashes(i)) bad += 1;
      });
      pts -= bad * 3;
      elScore.textContent = Math.max(0, pts) + " points";
      return { pts: pts, bad: bad };
    }

    function draw() {
      elBands.textContent = "";
      L().bands.forEach(function (key) {
        var B = BANDS[key], row = document.createElement("div"); row.className = "fb-band";
        var nm = document.createElement("div"); nm.className = "fb-name"; nm.textContent = B.name; row.appendChild(nm);
        var strip = document.createElement("div"); strip.className = "fb-strip"; row.appendChild(strip);
        elBands.appendChild(row);

        var lo = B.lo, hi = B.hi, W = hi - lo;
        var pc = function (mhz) { return ((mhz - lo) / W * 100) + "%"; };
        var wd = function (mhz) { return (mhz / W * 100) + "%"; };

        (B.dfs || []).forEach(function (d) {
          var el = document.createElement("div"); el.className = "fb-dfs";
          el.style.left = pc(d[0]); el.style.width = wd(d[1] - d[0]); strip.appendChild(el);
        });
        (B.ticks || []).forEach(function (t) {
          var el = document.createElement("div"); el.className = "fb-tick"; el.style.left = pc(t[0]);
          var b = document.createElement("b"); b.textContent = t[1]; el.appendChild(b); strip.appendChild(el);
        });

        if (sel !== null) {
          legal(key, sel.w).forEach(function (c) {
            var s = span(c, sel.w);
            var el = document.createElement("div"); el.className = "fb-slot";
            el.style.left = pc(s[0]); el.style.width = wd(sel.w);
            el.title = sel.w + " MHz centred at " + c + " MHz";
            el.addEventListener("click", function () { place(key, c); });
            strip.appendChild(el);
          });
        }

        // Overlapping access points get their own lane, otherwise three on one channel
        // draw as one block and the player cannot see what they just did.
        var here = [], lanes = [];
        placed.forEach(function (p, i) { if (p.band === key) here.push({ p: p, i: i }); });
        here.forEach(function (o) {
          var s = span(o.p.c, o.p.w), lane = 0;
          while (lanes.some(function (q) { return q.lane === lane && overlaps(s, span(q.c, q.w)); })) lane++;
          o.lane = lane; lanes.push({ lane: lane, c: o.p.c, w: o.p.w });
        });
        var depth = here.reduce(function (m, o) { return Math.max(m, o.lane + 1); }, 1);
        var band = 40 / depth;
        here.forEach(function (o) {
          var s = span(o.p.c, o.p.w);
          var el = document.createElement("div");
          el.className = "fb-ap" + (o.p.dead ? " fb-hit" : (clashes(o.i) ? " fb-clash" : ""));
          el.style.left = pc(s[0]); el.style.width = wd(o.p.w);
          el.style.top = (6 + o.lane * band) + "px";
          el.style.bottom = "auto";
          el.style.height = (band - 2) + "px";
          el.textContent = (o.p.w >= 40 && band > 16) ? o.p.w : "";
          el.title = "AP " + (o.p.q + 1) + ", " + o.p.w + " MHz. Tap to pick it up again";
          el.addEventListener("click", function () { pick(o.i); });
          strip.appendChild(el);
        });
      });
      drawQueue();
      check();
    }

    function drawQueue() {
      elQueue.textContent = "";
      L().queue.forEach(function (w, i) {
        var used = placed.some(function (p) { return p.q === i && !p.dead; });
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "fb-chip" + (used ? " done" : "") + (sel && sel.q === i ? " on" : "");
        chip.textContent = "AP " + (i + 1) + "  " + w + " MHz";
        if (!used) chip.addEventListener("click", function () {
          sel = (sel && sel.q === i) ? null : { q: i, w: w };
          draw();
        });
        elQueue.appendChild(chip);
      });
    }

    function place(band, c) {
      if (sel === null) return;
      placed = placed.filter(function (p) { return p.q !== sel.q; });
      placed.push({ q: sel.q, w: sel.w, band: band, c: c });
      var wasDfs = inDfs(band, c, sel.w);
      sel = null;
      draw();
      if (wasDfs && L().radar && !radarFired) armRadar();
    }

    function pick(i) {
      var p = placed[i];
      sel = { q: p.q, w: p.w };
      placed.splice(i, 1);
      draw();
    }

    function armRadar() {
      radarFired = true;
      setTimeout(function () {
        var live = placed.filter(function (p) { return inDfs(p.band, p.c, p.w) && !p.dead; });
        if (!live.length) return;
        var victim = live[Math.floor(Math.random() * live.length)];
        placed = placed.filter(function (p) { return p !== victim; });
        draw();
        say("<b>Radar.</b> The channel under AP " + (victim.q + 1) + " just went away for thirty minutes, and the access " +
            "point stopped serving clients while it moved. That is DFS: the room is real, and it is borrowed. " +
            "Put it somewhere else.");
      }, 4200);
    }

    function check() {
      var s = score();
      var allPlaced = L().queue.every(function (w, i) {
        return placed.some(function (p) { return p.q === i; });
      });
      elNext.disabled = !(allPlaced && (s.bad === 0 || L().nowin));
      if (!allPlaced) return;
      if (s.bad > 0 && L().nowin) {
        say("<b>There is no clean answer here, and that is the lesson.</b> Four access points, two non-DFS " +
            "80 MHz channels in the whole of 5 GHz. Whatever you do, two radios end up sharing air and each " +
            "of them gets less than it would have had at 40 MHz. Width is capacity per cell, bought with the " +
            "number of cells you can have. Next level hands you DFS and the room comes back, with a catch.");
      } else if (s.bad > 0) {
        say("Everything is placed, but " + s.bad + (s.bad === 1 ? " access point overlaps" : " access points overlap") +
            " another. Overlapping channels do not add capacity, they share it: both radios hear each other, " +
            "both defer, and you have built one slower cell out of two. Move the orange ones.");
      } else {
        say("<i>Clean plan.</i> No two access points share a frequency, so every one of them gets the air to itself.");
      }
    }

    function load(n) {
      lv = n; placed = []; sel = null; radarFired = false;
      elLv.textContent = "Level " + (n + 1);
      elTitle.textContent = L().title;
      elGoal.textContent = L().goal;
      elNext.textContent = n === LEVELS.length - 1 ? "Play again" : "Next level";
      say(L().open);
      draw();
    }

    elReset.addEventListener("click", function () { load(lv); });
    elNext.addEventListener("click", function () { load((lv + 1) % LEVELS.length); });
    load(0);
  })();
  </script>
</section>
